<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Campus Map · The Planning Pad</title>
<meta name="theme-color" content="#14202b">
<link rel="icon" type="image/png" href="../assets/favicon-64.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: field-guide app. Sticky header + tab bar; list → detail drill-down; one column on phones, list/detail split on wide screens. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#14202b; --muted:#566573; --line:#d3dae1;
  --accent:#c2410c; --accent-ink:#ffffff; --accent-soft:#fde9dc;
  --red:#b91c1c; --red-soft:#fde2e2; --amber:#a15c00; --amber-soft:#fff1d1; --blue:#1d4ed8; --blue-soft:#e0e9ff; --green:#15803d; --green-soft:#dcf3e4; --pink:#9d174d; --pink-soft:#fce7f3;
  --nfpa-blue:#1f5fbf; --nfpa-red:#d32626; --nfpa-yellow:#f2c300; --nfpa-white:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#18222c; --ink:#e6edf3; --muted:#9aa9b6; --line:#2b3945;
  --accent:#f97316; --accent-ink:#1a0d03; --accent-soft:#3a2214;
  --red:#f87171; --red-soft:#3b1a1c; --amber:#fbbf24; --amber-soft:#382b10; --blue:#93b4ff; --blue-soft:#1b2a4a; --green:#4ade80; --green-soft:#12301f; --pink:#f9a8d4; --pink-soft:#3a1a2c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#18222c; --ink:#e6edf3; --muted:#9aa9b6; --line:#2b3945;
  --accent:#f97316; --accent-ink:#1a0d03; --accent-soft:#3a2214;
  --red:#f87171; --red-soft:#3b1a1c; --amber:#fbbf24; --amber-soft:#382b10; --blue:#93b4ff; --blue-soft:#1b2a4a; --green:#4ade80; --green-soft:#12301f; --pink:#f9a8d4; --pink-soft:#3a1a2c;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand span{font-size:12px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:12px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sample{background:var(--amber-soft);color:var(--amber);font-size:13px}
.sample .wrap{padding-block:8px;display:flex;gap:8px;align-items:flex-start}
.sample b{font-weight:600}
main .wrap{padding-block:16px 48px}
.search{width:100%;font:16px var(--body);padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chipbtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.split{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
@media (min-width:860px){.split{grid-template-columns:340px 1fr;align-items:start}.list{position:sticky;top:120px;max-height:calc(100vh - 140px);overflow:auto}}
.list{display:flex;flex-direction:column;gap:8px;min-width:0}
.bcard{appearance:none;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.bcard[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.code{font-family:var(--mono);font-size:13px;background:var(--ink);color:var(--bg);padding:2px 6px;border-radius:4px;grid-row:span 2;align-self:start;margin-top:2px}
.bname{font-weight:600}
.bmeta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.p-red{background:var(--red-soft);color:var(--red)}.p-amber{background:var(--amber-soft);color:var(--amber)}.p-blue{background:var(--blue-soft);color:var(--blue)}.p-green{background:var(--green-soft);color:var(--green)}
.detail{min-width:0}
.back{display:none;appearance:none;border:0;background:none;color:var(--accent);font:600 14px var(--body);padding:4px 0 12px;cursor:pointer}
@media (max-width:859px){.split.has-detail .list{display:none}.split:not(.has-detail) .detail{display:none}.back{display:inline-block}}
.dhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}
.dhead h2{margin:0;font-family:var(--display);font-size:32px;line-height:1.1;text-wrap:balance}
.dhead .addr{color:var(--muted);font-size:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.facts div{background:var(--surface);padding:10px 12px}
.facts dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.alert{border-left:4px solid var(--red);background:var(--red-soft);color:var(--ink);padding:10px 14px;border-radius:0 6px 6px 0;margin-bottom:16px}
.alert h3{margin:0 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.alert ul{margin:0;padding-left:18px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.section h3{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--display);font-size:19px;letter-spacing:.03em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.rows{margin:0}
.row{display:grid;grid-template-columns:minmax(110px,32%) 1fr;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row dt{color:var(--muted);font-size:13px}
.row dd{margin:0;min-width:0}
.loc{font-family:var(--mono);font-size:13px}
.util-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line)}
.util{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.util .k{display:flex;align-items:center;gap:8px;font-weight:600}
.swatch{width:12px;height:12px;border-radius:2px;flex:none}
.util .v{font-size:14px}
.util .n{font-size:12px;color:var(--muted)}
.haz{display:grid;grid-template-columns:auto 1fr;gap:12px 16px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.haz:last-child{border-bottom:0}
.haz svg{width:64px;height:64px;display:block}
.haz .t{font-weight:600}
.haz .s{font-size:13px;color:var(--muted)}
.contact{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.contact:last-child{border-bottom:0}
.contact .who{min-width:0}
.contact .role{font-size:13px;color:var(--muted)}
.phone{display:flex;align-items:center;gap:8px}
.phone .num{font-family:var(--mono);font-size:14px;user-select:all;font-variant-numeric:tabular-nums}
.copy{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 12px var(--body);padding:4px 10px;border-radius:6px;cursor:pointer}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:8px}
/* SOPs */
.sopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:16px}
.sopcard{appearance:none;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.sopcard .cat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.sopcard h3{margin:0;font-family:var(--display);font-size:22px;line-height:1.1}
.sopcard p{margin:0;font-size:13px;color:var(--muted)}
.sopview h2{font-family:var(--display);font-size:32px;margin:0 0 4px}
.sopmeta{color:var(--muted);font-size:13px;margin-bottom:16px;display:flex;gap:8px 16px;flex-wrap:wrap}
.phase{margin-bottom:12px}
.steps{list-style:none;margin:0;padding:0}
.steps li{border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps label{display:grid;grid-template-columns:28px 22px 1fr;gap:8px;align-items:start;padding:10px 14px;cursor:pointer}
.steps .num{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:2px}
.steps input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.steps input:checked ~ span{color:var(--muted);text-decoration:line-through}
.sopactions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--body);padding:8px 14px;border-radius:6px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{font-size:13px;color:var(--muted);margin-top:12px}
h2.page{font-family:var(--display);font-size:28px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.02em}
.lede{color:var(--muted);margin:0 0 8px;max-width:65ch}
/* Map */
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto;margin-top:12px}
.mapbox svg{display:block;width:100%;min-width:560px;height:auto}
.m-ground{fill:var(--bg)}
.m-road{stroke:var(--line);stroke-width:14;fill:none;stroke-linecap:round}
.m-street{fill:var(--ink);font:700 15px var(--display);letter-spacing:.04em;text-transform:uppercase}
.m-num{fill:var(--muted);font:500 9px var(--mono)}
.m-roadlbl{fill:var(--muted);font:500 10px var(--body);letter-spacing:.06em;text-transform:uppercase}
.m-bld{cursor:pointer}
.m-bld rect{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.m-bld.haz rect{fill:var(--red-soft);stroke:var(--red)}
.m-bld.res rect{fill:var(--green-soft);stroke:var(--green)}
.m-bld.asm rect{fill:var(--blue-soft);stroke:var(--blue)}
.m-bld.sel rect{stroke:var(--accent);stroke-width:3.5}
.m-bld:focus-visible rect{stroke:var(--accent);stroke-width:3.5}
.m-bld:focus{outline:none}
.m-code{fill:var(--ink);font:700 13px var(--mono);pointer-events:none}
.m-asm circle{fill:var(--green);}
.m-asm text{fill:var(--surface);font:700 10px var(--body)}
.m-north{fill:var(--muted);font:600 11px var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:2px;border:1.5px solid;display:inline-block}
.mapsel{margin-top:12px}
.mapsel .row dd a,.addrlist a{color:var(--accent);font-weight:600}
.addrlist .contact .num{font-family:var(--body)}
.aerial{position:relative;min-width:640px}
.aerial img{display:block;width:100%;height:auto;max-width:none}
.pin{position:absolute;transform:translate(-50%,-50%);width:6.5%;aspect-ratio:2/1;min-width:34px;border:3px solid transparent;border-radius:6px;background:transparent;cursor:pointer;padding:0}
.pin:hover{border-color:rgba(255,255,255,.85)}
.pin.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,0,0,.45),0 0 18px 4px var(--accent)}
.pin.alerting{border-color:#ef4444;background:rgba(239,68,68,.35);box-shadow:0 0 0 3px rgba(0,0,0,.4),0 0 22px 6px #ef4444}
@media (prefers-reduced-motion:no-preference){.pin.alerting{animation:pinblink .8s steps(2,jump-none) infinite}}
@keyframes pinblink{0%{opacity:1}100%{opacity:.15}}
.eq{position:absolute;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:#f97316;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.5);cursor:pointer;padding:0;z-index:2}
.eq span{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);white-space:nowrap;background:rgba(20,32,43,.88);color:#fff;font:600 11px var(--body);padding:2px 6px;border-radius:4px;pointer-events:none}
.eq.sel{width:26px;height:26px;box-shadow:0 0 0 3px #f97316,0 0 18px 6px #f97316}
.gcp{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:#2563eb;color:#fff;font:700 12px var(--body);display:flex;align-items:center;justify-content:center;border:2px solid #fff;pointer-events:none;z-index:3}
.gcp.draft{background:#f97316}
.aerial.tapmode{cursor:crosshair;outline:3px dashed var(--accent);outline-offset:-3px}
.aerial.tapmode .pin{pointer-events:none}
.aerial.zooming{transition:transform .65s cubic-bezier(.4,0,.7,.6),opacity .65s ease-in;transform:scale(6);opacity:.15;pointer-events:none}
.m3d.intro{animation:m3dfade .5s ease-out}
@keyframes m3dfade{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.maphint{padding:10px 14px;background:var(--accent-soft);color:var(--ink);font-weight:600;font-size:14px}
.mapform{border-bottom:1px solid var(--line)}
.formbar.inline{position:static;border:0;padding:0;grid-column:1/-1;background:none}
.eqdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#f97316;margin-right:8px;vertical-align:middle}
.eqrow-sel{background:var(--accent-soft)}
.linkbtn{appearance:none;border:0;background:none;padding:0;color:var(--accent);font:600 13px var(--body);cursor:pointer;text-decoration:underline}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.field.wide{grid-column:1/-1}
.field input,.field textarea{font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.field textarea{resize:vertical;min-height:84px}
.formbar{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bmeta .btn{padding:6px 12px}
.m3d{position:relative;height:min(68vh,560px);min-height:320px;background:var(--bg);touch-action:none;overflow:hidden}
.m3d canvas{display:block}
.doorcard{position:absolute;left:10px;bottom:10px;max-width:min(340px,calc(100% - 20px));background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:grid;gap:4px;font-size:13px}
.doorcard .dc-top{display:flex;align-items:center;gap:8px}.doorcard .dc-x{margin-left:auto;border:0;background:none;font-size:20px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}
.doorcard .btn{justify-self:start;margin-top:4px}
.tagcard{max-height:calc(100% - 20px);overflow:auto}.tagcard .formbar{display:flex;gap:8px;flex-wrap:wrap}.tagcard .field{display:grid;gap:3px}
.p-gray{background:var(--line);color:var(--ink,inherit)}
.p-pink{background:var(--pink-soft);color:var(--pink)}
.doorrow{border-top:1px solid var(--line)}
.doorhead{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:10px 14px;cursor:pointer;color:inherit;font:inherit}
.doorhead:hover{background:var(--bg)}
.doorid{min-width:44px;justify-content:center}
.doormain{display:grid;gap:2px;flex:1;min-width:0}.doormain .role{font-size:12.5px}
.doorcond{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.doordetail{padding:0 14px 12px}
.doorgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px 12px;margin:0 0 10px}
.cranefind{display:grid;gap:4px;margin:0 0 10px;font-size:13.5px}.cranefind ol,.cranefind ul{margin:0 0 6px;padding-left:20px}.cranefind li{margin:2px 0}.cranefind p{margin:0 0 6px}
.doorgrid dt{font-size:11.5px;color:var(--muted)}.doorgrid dd{margin:0;font-size:13.5px;font-weight:600}
.m3d-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--muted);font-size:14px}
.m3dbar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
.m3dlegend{padding:0 14px;margin-top:0}
.m3dnote{padding:0 14px 12px}
.raise{appearance:none;border:0;background:#dc2626;color:#fff;font:700 14px var(--body);padding:8px 14px;border-radius:6px;cursor:pointer;white-space:nowrap;letter-spacing:.02em}
.raise:hover{background:#b91c1c}
.brand{overflow:hidden}
@media (max-width:520px){.brand span{display:none}.brand h1{font-size:20px;overflow:hidden;text-overflow:ellipsis}}
.btn.danger{background:#dc2626;border-color:#dc2626;color:#fff}
.alertbar{background:#b91c1c;color:#fff}
.alertbar:empty{display:none}
.alertlist{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.alertrow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:rgba(0,0,0,.18);border:2px solid rgba(255,255,255,.55);border-radius:8px;padding:10px 12px}
@media (prefers-reduced-motion:no-preference){.alertrow.fresh{animation:alertflash 1s ease-in-out 4}}
@keyframes alertflash{50%{background:rgba(255,255,255,.3)}}
.alertmain{min-width:0}
.alerttype{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.alertwhere{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.15}
.alertnote{font-size:14px;margin-top:2px}
.alertbtns{display:flex;gap:6px;flex-wrap:wrap}
.alertbtns .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.alertbtns .btn.alertgo{background:#fff;color:#b91c1c;border-color:#fff}
.alertform .chipbtn{display:inline-flex;align-items:center;gap:6px}
.field select{font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:20}
@media (prefers-reduced-motion:no-preference){.bcard,.sopcard{transition:border-color .15s}}
/* The Planning Pad: home link and the sign-in panel the shared sign-in code draws into #app */
.homelink{color:inherit;text-decoration:none;font:600 13px var(--body);opacity:.85;white-space:nowrap;margin-left:auto}
.homelink:hover{opacity:1;text-decoration:underline}
#appwrap{padding-block:12px}
#appwrap .hint{margin:0 0 8px;color:var(--muted);font-size:14px}
#app{--bad:var(--red);--ok:var(--green)}
#app .section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;max-width:440px}
#app h2{margin:0;font-family:var(--display);font-weight:700;letter-spacing:.02em;text-transform:uppercase;font-size:26px!important}
#app p{margin:0}

// lat/lon -> image % using the control points (similarity fit for 2 points, least-squares affine for 3+)
function geoFit(){

  const m=p=>[(p.lon-lon0)*kx,-(p.lat-lat0)*ky],px=p=>[p.x*24,p.y*18];

    const [a1,b1]=m(P[0]),[a2,b2]=m(P[1]),[c1,d1]=px(P[0]),[c2,d2]=px(P[1]);
    const dmx=a2-a1,dmy=b2-b1,dpx=c2-c1,dpy=d2-d1,den=dmx*dmx+dmy*dmy;if(!den)return null;
    const ar=(dpx*dmx+dpy*dmy)/den,ai=(dpy*dmx-dpx*dmy)/den;
    f=(u,v)=>[c1+ar*(u-a1)-ai*(v-b1),d1+ai*(u-a1)+ar*(v-b1)];
  } else {
    const A=[[0,0,0],[0,0,0],[0,0,0]],bx=[0,0,0],by=[0,0,0];
    P.forEach(p=>{const [u,v]=m(p),[X,Y]=px(p),r=[u,v,1];for(let i=0;i<3;i++){for(let j=0;j<3;j++)A[i][j]+=r[i]*r[j];bx[i]+=r[i]*X;by[i]+=r[i]*Y}});
    const solve=(M,b)=>{const a=M.map((r,i)=>[...r,b[i]]);for(let i=0;i<3;i++){let k=i;for(let j=i+1;j<3;j++)if(Math.abs(a[j][i])>Math.abs(a[k][i]))k=j;[a[i],a[k]]=[a[k],a[i]];if(Math.abs(a[i][i])<1e-9)return null;for(let j=0;j<3;j++)if(j!==i){const t=a[j][i]/a[i][i];for(let c=i;c<4;c++)a[j][c]-=t*a[i][c]}}return a.map((r,i)=>r[3]/r[i])};
    const cx=solve(A,bx),cy=solve(A,by);if(!cx||!cy)return null;

}

(async()=>{

function showDoorCard(code,id){

}

    <span class="doorcond">${craneCounts(c)}${c.noReport?"":`<br>${c.rec.length} recommendation${c.rec.length===1?"":"s"}`}</span></button>
    <div class="doordetail" hidden>${c.noReport?"":`<dl class="doorgrid">${[["Type",c.type],["Capacity",c.cap],["Crane make",c.make],["Crane serial",c.serial],["Inspected",c.date],["Report location",c.loc],...c.hoists.flatMap(h=>[["Hoist "+h.id,h.make],[h.id+" serial",h.serial],[h.id+" throat opening",h.throat],[h.id+" chain / rope",h.chain]])].map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
      <div class="cranefind"><b>Deficiencies</b>${c.def.length?`<ol>${c.def.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:`<p class="role">None listed.</p>`}
      <b>Recommendations</b>${c.rec.length?`<ol>${c.rec.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:`<p class="role">None listed.</p>`}
      ${c.notes.length||c.missing?`<b>Notes</b><ul>${c.notes.map(x=>`<li>${esc(x)}</li>`).join("")}${c.missing?`<li>${esc(c.missing)}</li>`:""}</ul>`:""}</div>`}
      ${c.notOnMap?`<p class="note" style="margin:0 0 8px">This crane is not on the crane map, so it isn't in the 3D model yet.</p>`:`<button class="btn" data-crane3d="${id}">Show in 3D</button>`}</div></div>`).join("")}</section>`;
}
function openCraneRow(id,scroll){const r=document.getElementById("crane-"+id);if(!r)return;const d=r.querySelector(".doordetail"),h=r.querySelector(".doorhead");d.hidden=false;h.setAttribute("aria-expanded","true");r.classList.add("open");if(scroll)r.scrollIntoView({block:"center",behavior:"smooth"})}
function showCraneCard(code,id){
  const el=document.getElementById("m3d");const c=(CRANEINFO[code]||{})[id];if(!el||!c)return;
  let k=el.querySelector(".doorcard");if(!k){k=document.createElement("div");k.className="doorcard";el.appendChild(k)}
  k.innerHTML=`<div class="dc-top"><span class="pill p-amber">${id}</span><b>${c.noReport?"Overhead crane":esc(c.cap)+" · "+esc(c.type)}</b><button class="dc-x" data-doorcardx aria-label="Close">×</button></div>
  ${c.noReport?`<div class="role">No inspection report was included for this crane.</div>`:`<div class="role">${c.hoists.map(h=>esc(h.id+" "+h.make)).join(" · ")}</div><div class="role">${craneCounts(c)} · ${c.rec.length} recommendation${c.rec.length===1?"":"s"} · Inspected ${esc(c.date)}</div>${c.def.length?`<div class="role">${esc(c.def[0])}${c.def.length>1?" (and "+(c.def.length-1)+" more)":""}</div>`:""}`}
  <button class="btn" data-craneinfo="${id}">All details</button>`;
}
const HAS3D=[]; /* 3D floor-plan models are left off the public site for now */let viewer3d=null,loading3d=null;
// Tags and equipment people pin on the 3D model; stored in the shared "tags3d" collection {building,kind,label,note,x,y,h}
let TAGS=[];
const TAGKINDS=[["equipment","Equipment","p-blue"],["safety","Safety (extinguisher, AED, eyewash)","p-green"],["hazard","Hazard","p-red"],["shutoff","Shutoff (gas, water, power)","p-amber"],["tag","Note","p-gray"]];
const tagKind=k=>TAGKINDS.find(x=>x[0]===k)||TAGKINDS[4];
const tagsFor=code=>TAGS.filter(t=>t.building===code);
function syncTags(){if(viewer3d&&state.view3d)viewer3d.setTags(tagsFor(state.view3d));const l=document.getElementById("taglist");if(l&&state.bld)l.outerHTML=tagSection(state.bld)}
function tagSection(code){
  if(!HAS3D.includes(code)||!DB)return "";const L=tagsFor(code);
  return `<section class="section" id="taglist"><h3>Tags and equipment on the 3D model <span class="pill p-blue">${L.length}</span></h3>
  <p class="note" style="margin:0;padding:8px 14px 0">${CAN_EDIT?"Open the 3D model and tap Add tag, then tap the spot. Everyone on the team sees what you add.":"Tags the team has pinned on the 3D model."}</p>
  ${L.map(t=>{const k=tagKind(t.kind);return `<div class="contact"><div class="who"><div><span class="pill ${k[2]}">${esc(k[1].split(" (")[0])}</span> <b>${esc(t.label||"Tag")}</b></div>${t.note?`<div class="role">${esc(t.note)}</div>`:""}</div><button class="btn" data-tagshow="${esc(t.id)}">Show in 3D</button></div>`}).join("")||`<p class="note" style="padding:6px 14px 12px;margin:0">Nothing pinned yet.</p>`}</section>`;
}
function tagCard(html){const el=document.getElementById("m3d");if(!el)return null;el.querySelectorAll(".doorcard").forEach(c=>c.remove());const c=document.createElement("div");c.className="doorcard tagcard";c.innerHTML=html;el.appendChild(c);return c}
function stopTagPick(){if(viewer3d){viewer3d.pick(null);viewer3d.showGhost(null)}state.tagDraft=null;state.tagMove=null}
function startTagAdd(){
  if(!viewer3d)return;stopTagPick();
  tagCard(`<div class="dc-top"><b>Add a tag</b><button class="dc-x" data-tagcancel aria-label="Cancel">×</button></div><span class="role">Tap the model where it goes: a floor, a wall or a door.</span>`);
  viewer3d.pick(at=>{const kind=(document.getElementById("tg-kind")||{}).value||"equipment";state.tagDraft={...at,kind};viewer3d.showGhost(state.tagDraft);if(!document.getElementById("tagform"))showTagForm()});
}
function showTagForm(){
  const c=tagCard(`<form id="tagform" class="fgrid"><div class="dc-top"><b>New tag</b><button class="dc-x" type="button" data-tagcancel aria-label="Cancel">×</button></div>
  <span class="role">Tap the model again to move it.</span>
  <label class="field" for="tg-kind"><span>Type</span><select id="tg-kind" name="kind">${TAGKINDS.map(k=>`<option value="${k[0]}">${esc(k[1])}</option>`).join("")}</select></label>
  <label class="field" for="tg-label"><span>Name</span><input id="tg-label" name="label" placeholder="Fire extinguisher" autocomplete="off" required maxlength="60"></label>
  <label class="field" for="tg-note"><span>Note (optional)</span><input id="tg-note" name="note" placeholder="Class ABC, checked monthly" autocomplete="off" maxlength="200"></label>
  <div class="formbar inline"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-tagcancel>Cancel</button></div></form>`);
  if(c){const i=c.querySelector("#tg-label");if(i)i.focus({preventScroll:true})}
}
async function saveTag(f){
  const d=state.tagDraft,label=f.label.value.trim();if(!d||!label){toast("Add a name first");return}
  const body={building:state.view3d,kind:f.kind.value,label,note:f.note.value.trim(),x:d.x,y:d.y,h:d.h,createdAt:new Date().toISOString()};
  try{const id=USER?await USER.id():null;if(id)body.createdBy=id}catch(e){}
  try{await DB.collection("tags3d").add(body);stopTagPick();const c=document.querySelector(".tagcard");if(c)c.remove();toast("Added "+label)}catch(e){toast("Couldn't save. You may not have edit access.")}
}
function showTagCard(id){
  const t=TAGS.find(x=>x.id===id);if(!t)return;const k=tagKind(t.kind);stopTagPick();
  tagCard(`<div class="dc-top"><span class="pill ${k[2]}">${esc(k[1].split(" (")[0])}</span><b>${esc(t.label||"Tag")}</b><button class="dc-x" data-doorcardx aria-label="Close">×</button></div>
  ${t.note?`<span>${esc(t.note)}</span>`:""}<span class="role">Added ${t.createdAt?ago(t.createdAt):""}<span id="tag-by"></span>${t.h?` · ${Math.round(t.h)} ft up`:""}</span>
  ${CAN_EDIT?`<div class="formbar inline"><button class="btn" data-tagmove="${esc(id)}">Move</button><button class="btn" data-tagdel="${esc(id)}">Delete</button></div>`:""}`);
  if(t.createdBy&&USER&&USER.profiles)USER.profiles([t.createdBy]).then(ps=>{const el=document.getElementById("tag-by");if(el)el.textContent=" by "+((ps[t.createdBy]&&ps[t.createdBy].name)||"a teammate")},()=>{});
}
function startTagMove(id){
  const t=TAGS.find(x=>x.id===id);if(!t||!viewer3d)return;stopTagPick();state.tagMove=id;
  tagCard(`<div class="dc-top"><b>Move ${esc(t.label||"tag")}</b><button class="dc-x" data-tagcancel aria-label="Cancel">×</button></div><span class="role">Tap the new spot on the model.</span>`);
  viewer3d.pick(async at=>{viewer3d.pick(null);state.tagMove=null;try{await DB.doc("tags3d/"+id).update({x:at.x,y:at.y,h:at.h,updatedAt:new Date().toISOString()});const c=document.querySelector(".tagcard");if(c)c.remove();toast("Moved")}catch(e){toast("Couldn't move it. You may not have edit access.")}});
}
function loadScript(src){return new Promise((res,rej)=>{const sc=document.createElement("script");sc.src=src;sc.onload=res;sc.onerror=()=>rej(new Error(src));document.head.appendChild(sc)})}
function load3d(){return loading3d||(loading3d=(async()=>{
  if(!window.THREE)await loadScript("https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js");
  if(!THREE.OrbitControls)await loadScript("https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js");
  if(!window.Model3D)await loadScript("model3d.js");
})().catch(e=>{loading3d=null;throw e}))}
async function mount3d(){
  const el=document.getElementById("m3d");if(!el)return;
  el.innerHTML='<div class="m3d-msg">Loading 3D model…</div>';
  try{await load3d()}catch(e){if(document.body.contains(el))el.innerHTML='<div class="m3d-msg">The 3D model could not load. Check your connection, then close and reopen it.</div>';return}
  if(!document.body.contains(el)||state.view3d!==state.bld)return;
  el.innerHTML="";
  try{const code=state.view3d;const v=await Model3D.mount(el,code,{intro:state.intro&&!(state.intro=false),onDoor:id=>showDoorCard(code,id),onCrane:id=>showCraneCard(code,id),onTag:id=>showTagCard(id),onCranes:on=>{const bt=document.querySelector('[data-m3="cranes"]');if(bt)bt.textContent=on?"Hide cranes":"Show cranes"},onButton:label=>{state.raising=true;state.prefill={building:code,location:label};state.view3d=null;render();window.scrollTo(0,0)}});if(v){v.setTags(tagsFor(code));v.setActive(ALERTS.filter(a=>a.building===code).map(a=>a.location));if(state.focus){v.focus(state.focus);state.focus=null}if(state.doorCard){showDoorCard(code,state.doorCard);state.doorCard=null}if(state.craneCard){showCraneCard(code,state.craneCard);state.craneCard=null}if(state.tagFocus){v.focusTag(state.tagFocus);const id=state.tagFocus;state.tagFocus=null;setTimeout(()=>showTagCard(id),50)}}if(!document.body.contains(el)||state.view3d!==state.bld){if(v)v.dispose();return}viewer3d=v}catch(e){el.innerHTML='<div class="m3d-msg">This device could not draw the 3D model.</div>'}
}
function renderAfter(){if(state.view3d&&document.getElementById("m3d"))mount3d();const b=BUILDINGS.find(x=>x.code===state.bld);if(b&&state.tab==="buildings"&&!state.editing)showUpdatedBy(b)}
render();
</script>
<script type="module" src="../tracker/shim.js"></script>
</html>
