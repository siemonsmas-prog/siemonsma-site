<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Work Orders · The Planning Pad</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/favicon-64.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&display=swap">
<style>
:root{
  --night:#0b111b;      /* page ground */
  --panel:#121a27;      /* cards, header */
  --line:#223047;       /* hairlines */
  --steel:#e9eef6;      /* primary text */
  --mist:#9aa9be;       /* secondary text */
  --signal:#3d8bff;     /* the one accent */
  --signal-ink:#ffffff;
  --late:#ffb547;       /* overdue marker on this page */
  --display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--steel);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:4px}
.wrap{max-width:900px;margin:0 auto;padding-inline:clamp(16px,3vw,28px)}
[hidden]{display:none!important}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--night) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:60px;padding-block:8px}
.brand{font-family:var(--display);font-weight:900;font-stretch:125%;font-size:1.3rem;letter-spacing:.01em;text-decoration:none;color:var(--steel);white-space:nowrap}
.brand span{color:var(--signal)}
.top .who{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--mist);font-size:.88rem;min-width:0}
.top .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

h1{margin:28px 0 4px;font-family:var(--display);font-weight:900;font-stretch:118%;font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.05;letter-spacing:.01em;text-transform:uppercase}
.sub{margin:0;color:var(--mist)}
.rule{width:64px;height:3px;background:var(--signal);margin:16px 0 20px;border:0}

.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--steel);font:inherit;font-size:.92rem;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--signal)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.small{padding:6px 10px;font-size:.82rem}
.btn[disabled]{opacity:.6;cursor:default}

/* sign-in */
.signin{max-width:380px;margin:40px auto;padding:24px;border:1px solid var(--line);border-radius:8px;background:var(--panel);display:grid;gap:12px}
.signin h2{margin:0;font-family:var(--display);font-weight:800;font-stretch:110%;font-size:1.2rem;letter-spacing:.04em;text-transform:uppercase}
.signin p{margin:0;color:var(--mist);font-size:.92rem}
label{display:grid;gap:4px;font-size:.85rem;color:var(--mist)}
input{font:inherit;color:var(--steel);background:var(--night);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
input:focus{border-color:var(--signal);outline:none}
.linkish{background:none;border:0;padding:0;color:var(--mist);font:inherit;font-size:.85rem;text-decoration:underline;cursor:pointer;justify-self:start}
.msg{font-size:.9rem;color:var(--late);min-height:1.2em}

/* toolbar */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mist);font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--signal);color:var(--steel);background:color-mix(in srgb,var(--signal) 14%,transparent)}
.bar .asof{margin-left:auto;color:var(--mist);font-size:.8rem}

/* list */
.list{list-style:none;margin:0 0 40px;padding:0;display:grid;gap:10px}
.wo{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;background:var(--panel);padding:14px 16px;display:grid;gap:6px}
.wo.late{border-left-color:var(--late)}
.wo .row1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wo .num{font-weight:700;color:var(--signal);font-variant-numeric:tabular-nums}
.wo h3{margin:0;font-size:1.05rem;font-weight:700;flex:1;min-width:12ch}
.wo .meta{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--mist);font-size:.86rem}
.wo .due.late{color:var(--late);font-weight:700}
.wo .desc{margin:0;color:var(--mist);font-size:.9rem}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--line);font-size:.78rem;color:var(--steel);white-space:nowrap}
.wo .actions{display:flex;justify-content:flex-end}
.empty,.state{padding:28px 18px;border:1px dashed var(--line);border-radius:8px;text-align:center;color:var(--mist)}
.skeleton{height:92px;border-radius:8px;background:linear-gradient(90deg,var(--panel),color-mix(in srgb,var(--panel) 70%,var(--line)),var(--panel));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="../">THE PLANNING <span>PAD</span></a>
  <div class="who" id="who" hidden><span id="whoName"></span><button class="btn small" id="signOut" type="button">Sign out</button></div>
</div></header>

<main class="wrap">
  <h1>My Work Orders</h1>
  <p class="sub">Open work assigned to you, shared with you, or on your Manager team in Limble.</p>
  <hr class="rule">

  <form class="signin" id="signin" hidden>
    <h2>Sign in</h2>
    <p>Use the same account as the project tracker.</p>
    <label>Email <input id="email" type="email" autocomplete="username" required></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit" id="signinBtn">Sign in</button>
    <button class="linkish" type="button" id="reset">Forgot password?</button>
    <div class="msg" id="signinMsg" role="status"></div>
    <p>Looking for Limble? <a href="https://limble.com">Go to limble.com</a></p>
  </form>

  <section id="board" hidden>
    <div class="bar">
      <div class="chips" role="group" aria-label="Show">
<!-- filled from the data: All, one per assignee (Mine, Manager team), Overdue -->
      </div>
      <button class="btn small" type="button" id="refresh">Refresh</button>
      <span class="asof" id="asof"></span>
    </div>
    <ul class="list" id="list" aria-live="polite"></ul>
  </section>
</main>

<script src="../tracker/config.js"></script>
<script type="module">
import {initializeApp,getAuth,onAuthStateChanged,signInWithEmailAndPassword,sendPasswordResetEmail,signOut} from "../tracker/vendor/firebase.js";

// The Limble connector checks the Firebase sign-in and returns this person's open work orders.
const API = "https://limble-connector.siemonsmas.workers.dev/api/my-work-orders";
// Only the facilities manager sees this page; anyone else who signs in goes straight on to Limble.
const OWNER = String(window.APP_CONFIG.ownerEmail || "").trim().toLowerCase();
const LIMBLE = "https://limble.com";

const auth = getAuth(initializeApp(window.APP_CONFIG.firebase));
const $ = (id) => document.getElementById(id);
let rows = [], filter = "all";

function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
const fmt = (d) => d ? new Date(d + "T12:00:00").toLocaleDateString(undefined, {month: "short", day: "numeric", year: "numeric"}) : "";

const matches = (r) => filter === "all" || (filter === "late" ? r.overdue : r.assignedTo === filter);
function renderChips() {
  const box = document.querySelector(".chips"); box.replaceChildren();
  const who = [...new Set(rows.map((r) => r.assignedTo).filter(Boolean))].sort((a, b) => (b === "You") - (a === "You"));
  const opts = [["all", "All"], ...who.map((w) => [w, w === "You" ? "Mine" : w]), ["late", "Overdue"]];
  if (!opts.some(([v]) => v === filter)) filter = "all";
  for (const [value, label] of opts) {
    const n = rows.filter((r) => value === "all" || (value === "late" ? r.overdue : r.assignedTo === value)).length;
    const b = el("button", "chip", `${label} (${n})`);
    b.type = "button"; b.setAttribute("aria-pressed", String(value === filter));
    b.addEventListener("click", () => { filter = value; render(); });
    box.append(b);
  }
}

function render() {
  const list = $("list"); list.replaceChildren();
  renderChips();
  const shown = rows.filter(matches);
  if (!shown.length) { list.append(el("li", "empty", filter === "late" ? "Nothing overdue." : "No open work orders here.")); return; }
  for (const r of shown) {
    const li = el("li", "wo" + (r.overdue ? " late" : ""));
    const row1 = el("div", "row1");
    row1.append(el("span", "num", "#" + r.taskID), el("h3", null, r.name), el("span", "pill", r.status));
    const meta = el("div", "meta");
    if (r.due) meta.append(el("span", "due" + (r.overdue ? " late" : ""), (r.overdue ? "Overdue · due " : "Due ") + fmt(r.due)));
    if (r.assignedTo) meta.append(el("span", null, r.assignedTo === "You" ? "Assigned to you" : r.assignedTo === "Shared" ? (r.sharedWith ? "Shared with " + r.sharedWith : "Shared") : r.assignedTo));
    if (r.priority) meta.append(el("span", null, r.priority));
    meta.append(el("span", null, r.type));
    if (r.asset) meta.append(el("span", null, r.asset));
    if (r.location) meta.append(el("span", null, r.location));
    li.append(row1, meta);
    if (r.description) li.append(el("p", "desc", r.description));
    const actions = el("div", "actions");
    const a = el("a", "btn small", "Open in Limble");
    a.href = "https://app.limblecmms.com/taskList?taskID=" + encodeURIComponent(r.taskID);
    a.target = "_blank"; a.rel = "noopener";
    actions.append(a); li.append(actions);
    list.append(li);
  }
}

async function load() {
  const list = $("list"); $("refresh").disabled = true;
  if (!rows.length) list.replaceChildren(...[1, 2, 3].map(() => el("li", "skeleton")));
  try {
    const token = await auth.currentUser.getIdToken();
    const res = await fetch(API, {headers: {Authorization: "Bearer " + token}});
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Couldn't load work orders.");
    rows = data.workOrders || [];
    $("asof").textContent = "Updated " + new Date(data.asOf || Date.now()).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
    render();
  } catch (e) {
    list.replaceChildren(el("li", "state", e.message));
  } finally {
    $("refresh").disabled = false;
  }
}

onAuthStateChanged(auth, (user) => {
  if (user && user.emailVerified && String(user.email).toLowerCase() !== OWNER) { location.replace(LIMBLE); return; }
  const inside = Boolean(user && user.emailVerified);
  $("signin").hidden = inside; $("board").hidden = !inside; $("who").hidden = !inside;
  if (user && !user.emailVerified) $("signinMsg").textContent = "Confirm your email first (check your inbox), then sign in.";
  if (inside) { $("whoName").textContent = user.email; load(); }
});

$("signin").addEventListener("submit", async (e) => {
  e.preventDefault(); $("signinMsg").textContent = ""; $("signinBtn").disabled = true;
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value); }
  catch { $("signinMsg").textContent = "That email and password didn't work."; }
  finally { $("signinBtn").disabled = false; }
});
$("reset").addEventListener("click", async () => {
  const email = $("email").value.trim();
  if (!email) { $("signinMsg").textContent = "Enter your email above first."; return; }
  try { await sendPasswordResetEmail(auth, email); } catch {}
  $("signinMsg").textContent = "If that account exists, a reset link is on its way.";
});
$("signOut").addEventListener("click", () => signOut(auth));
$("refresh").addEventListener("click", load);
</script>
<script>
/* Talk to type, for every text box on siemonsma.org.
   Tap a text box and a mic appears at its right edge. Tap the mic and talk: the words go in where the
   cursor is, as you speak. Tap the mic again (or start typing, or leave the box) to stop.
   Uses the browser's own speech recognition (Chrome, Edge, Samsung Internet, Safari). Where the browser
   has none (Firefox), no mic is shown. package.py inlines this file into every page it builds. */
(function () {
  "use strict";
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR || window.__dictateLoaded) return;
  window.__dictateLoaded = true;

  var TEXT_TYPES = { "": 1, text: 1, search: 1, email: 1, url: 1 };
  function isTextBox(el) {
    if (!el || el.disabled || el.readOnly || el.dataset.noDictate !== undefined) return false;
    if (el.tagName === "TEXTAREA") return true;
    if (el.tagName === "INPUT") return TEXT_TYPES[(el.getAttribute("type") || "").toLowerCase()] === 1;
    return false;
  }

  var css = document.createElement("style");
  css.textContent =
    ".dict-mic{position:fixed;z-index:2147483000;width:32px;height:32px;border:0;border-radius:50%;padding:0;margin:0;" +
    "display:flex;align-items:center;justify-content:center;cursor:pointer;background:#3d8bff;color:#fff;" +
    "box-shadow:0 2px 6px rgba(0,0,0,.35);-webkit-tap-highlight-color:transparent;touch-action:manipulation}" +
    ".dict-mic svg{width:18px;height:18px;display:block}" +
    ".dict-mic.on{background:#e5484d;animation:dict-pulse 1.2s ease-out infinite}" +
    "@keyframes dict-pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.6)}100%{box-shadow:0 0 0 12px rgba(229,72,77,0)}}" +
    ".dict-tip{position:fixed;z-index:2147483001;left:50%;bottom:24px;transform:translateX(-50%);max-width:90vw;" +
    "background:#121a27;color:#e9eef6;border:1px solid #26344c;border-radius:10px;padding:10px 14px;" +
    "font:500 15px/1.4 system-ui,Arial,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.4)}" +
    "@media (prefers-reduced-motion:reduce){.dict-mic.on{animation:none}}";
  document.head.appendChild(css);

  var MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>';
  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "dict-mic";
  btn.innerHTML = MIC;
  btn.hidden = true;
  btn.setAttribute("aria-label", "Talk to type");
  btn.setAttribute("data-no-dictate", "");

  var field = null;      // the text box the mic belongs to
  var rec = null;        // live recognition session
  var listening = false; // the mic is on (sessions may restart underneath)
  var pre = "", post = ""; // text before and after the spoken part
  var spoken = "";       // finished words from earlier sessions this time the mic was on
  var raf = 0, tipTimer = 0;

  function place() {
    raf = 0;
    if (!field || !document.contains(field)) { hide(); return; }
    var r = field.getBoundingClientRect();
    if (!r.width || r.bottom < 0 || r.top > innerHeight) { btn.style.display = "none"; return; }
    btn.style.display = "";
    var size = Math.max(24, Math.min(32, r.height - 6));
    btn.style.width = btn.style.height = size + "px";
    var top = field.tagName === "TEXTAREA" ? r.bottom - size - 4 : r.top + (r.height - size) / 2;
    btn.style.top = Math.round(top) + "px";
    btn.style.left = Math.round(r.right - size - 4) + "px";
  }
  function schedule() { if (field && !raf) raf = requestAnimationFrame(place); }
  function show(el) {
    if (field !== el) stop();
    field = el;
    if (!btn.isConnected) document.body.appendChild(btn);
    btn.hidden = false;
    place();
  }
  function hide() { stop(); field = null; btn.hidden = true; }

  function tip(msg) {
    var t = document.querySelector(".dict-tip");
    if (!t) { t = document.createElement("div"); t.className = "dict-tip"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(function () { t.remove(); }, 5000);
  }

  function caret(el) {
    try { return [el.selectionStart, el.selectionEnd]; } catch (e) { return null; } // email/url boxes have no cursor
  }
  function joinText(a, b) {
    if (!b) return a;
    if (!a) return b.charAt(0).toUpperCase() + b.slice(1);
    if (/[.!?]\s*$/.test(a)) b = b.charAt(0).toUpperCase() + b.slice(1);
    return /\s$/.test(a) ? a + b : a + " " + b;
  }
  function glue(a, b) { return a && b ? a + " " + b : a || b; }
  function write(text) {
    if (!field) return;
    var mid = joinText(pre, text);
    var tail = post && !/^\s/.test(post) && text ? " " + post : post;
    var v = mid + tail;
    if (field.maxLength > 0 && v.length > field.maxLength) v = v.slice(0, field.maxLength);
    field.value = v;
    var at = Math.min(mid.length, v.length);
    try { field.setSelectionRange(at, at); } catch (e) {}
    field.dispatchEvent(new Event("input", { bubbles: true }));
  }

  function session() {
    rec = new SR();
    rec.lang = document.documentElement.lang && document.documentElement.lang.length > 2 ? document.documentElement.lang : "en-US";
    rec.interimResults = true;
    // Android Chrome repeats words in continuous mode, so there each session is one phrase and we restart it.
    rec.continuous = !/Android/i.test(navigator.userAgent);
    var finals = "";
    rec.onresult = function (e) {
      var fin = "", live = "";
      for (var i = 0; i < e.results.length; i++) {
        var t = e.results[i][0].transcript;
        if (e.results[i].isFinal) fin += t; else live += t;
      }
      finals = fin.trim();
      write(glue(spoken, (fin + live).trim()));
    };
    rec.onerror = function (e) {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        tip("The microphone is blocked. Allow it for siemonsma.org in your browser's site settings, then tap the mic again.");
        listening = false;
      } else if (e.error === "network") {
        tip("Talk to type needs an internet connection.");
        listening = false;
      } else if (e.error === "audio-capture") {
        tip("No microphone found.");
        listening = false;
      }
    };
    rec.onend = function () {
      spoken = glue(spoken, finals);
      rec = null;
      if (listening && field) {
        try { session(); return; } catch (err) {}
      }
      finish();
    };
    rec.start();
  }

  function start() {
    if (!field) return;
    var c = caret(field), v = field.value;
    if (c && c[0] != null) { pre = v.slice(0, c[0]); post = v.slice(c[1]); } else { pre = v; post = ""; }
    spoken = "";
    listening = true;
    btn.classList.add("on");
    btn.setAttribute("aria-label", "Stop talking");
    try { session(); } catch (e) { listening = false; finish(); }
  }
  function stop() {
    if (!listening && !rec) return;
    listening = false;
    if (rec) { try { rec.stop(); } catch (e) { finish(); } } else finish();
  }
  function finish() {
    btn.classList.remove("on");
    btn.setAttribute("aria-label", "Talk to type");
    if (field && spoken) field.dispatchEvent(new Event("change", { bubbles: true }));
    spoken = "";
  }

  // keep the cursor in the box when the mic is pressed, so the phone keyboard and focus stay put
  btn.addEventListener("pointerdown", function (e) { e.preventDefault(); });
  btn.addEventListener("mousedown", function (e) { e.preventDefault(); });
  btn.addEventListener("click", function (e) {
    e.preventDefault(); e.stopPropagation();
    if (listening) stop(); else { if (field && document.activeElement !== field) field.focus(); start(); }
  });

  document.addEventListener("focusin", function (e) {
    if (e.target === btn) return;
    if (isTextBox(e.target)) show(e.target); else if (field) hide();
  });
  document.addEventListener("focusout", function (e) {
    if (e.target !== field) return;
    setTimeout(function () { if (field && document.activeElement !== field && document.activeElement !== btn) hide(); }, 150);
  });
  // typing yourself takes over from the mic
  document.addEventListener("keydown", function (e) { if (listening && e.target === field && e.key.length === 1) stop(); }, true);
  addEventListener("scroll", schedule, true);
  addEventListener("resize", schedule);
  if (window.visualViewport) { visualViewport.addEventListener("resize", schedule); visualViewport.addEventListener("scroll", schedule); }
  new MutationObserver(function (list) {
    for (var i = 0; i < list.length; i++) if (list[i].target !== btn && !btn.contains(list[i].target)) { schedule(); return; }
  }).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "style", "hidden"] });
  document.addEventListener("visibilitychange", function () { if (document.hidden) stop(); });
  if (document.activeElement && isTextBox(document.activeElement)) show(document.activeElement);
})();
</script>
</body>
</html>
