<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Technician Work Order Board</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/favicon-64.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Same look as the Technician Work Order Board on Claude. Always-on version: reads the Limble connector with the board key. */
:root{
  --bg:#eef1f4;--surface:#fff;--ink:#14202b;--muted:#566573;--line:#d3dae1;--accent:#c2410c;
  --red:#b91c1c;--red-soft:#fde2e2;--amber:#a15c00;--amber-soft:#fff1d1;--blue:#1d4ed8;--blue-soft:#e0e9ff;--green:#15803d;--green-soft:#dcf3e4;--pink:#9d174d;--pink-soft:#fce7f3;--teal:#0f766e;--teal-soft:rgba(20,184,166,.16);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{--bg:#0f161d;--surface:#18222c;--ink:#e6edf3;--muted:#9aa9b6;--line:#2b3945;--accent:#f97316;--red:#f87171;--red-soft:#3b1a1c;--amber:#fbbf24;--amber-soft:#382b10;--blue:#93b4ff;--blue-soft:#1b2a4a;--green:#4ade80;--green-soft:#12301f;--pink:#f9a8d4;--pink-soft:#3a1a2c;--teal:#5eead4;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--bg);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
header h1{margin:0;font:700 24px var(--display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header span{font-size:12px;opacity:.7}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--body);padding:8px 14px;border-radius:6px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
main .wrap{padding-block:16px 60px}
h2{font:700 30px var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0 0 6px}
.lede{color:var(--muted);margin:0 0 10px;max-width:70ch}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--body);padding:7px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.7;margin-left:3px;font-variant-numeric:tabular-nums}
.grid{display:grid;gap:16px}
@media (min-width:1000px){.grid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
.aerial{position:relative;min-width:600px}
.aerial img{display:block;width:100%;height:auto;max-width:none}
.pin{position:absolute;transform:translate(-50%,-50%);width:6.5%;aspect-ratio:2/1;min-width:34px;border:3px solid transparent;border-radius:6px;background:transparent;padding:0;cursor:pointer}
.pin[data-n]::after{content:attr(data-n);position:absolute;top:-11px;right:-11px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;font:700 12px/18px var(--body);border:2px solid #fff;box-sizing:border-box;text-align:center}
.pin.wr{border-color:#facc15;background:rgba(250,204,21,.38);box-shadow:0 0 0 3px rgba(0,0,0,.4),0 0 20px 5px #facc15}.pin.wr::after{background:#facc15;color:#1a1300}
.pin.mine{border-color:#14b8a6;background:rgba(20,184,166,.35);box-shadow:0 0 0 3px rgba(0,0,0,.4),0 0 20px 6px #14b8a6}.pin.mine::after{background:#14b8a6;color:#04201c}
@media (prefers-reduced-motion:no-preference){.pin.wr,.tile.wr{animation:blink 1.1s steps(2,jump-none) infinite}}
@keyframes blink{50%{opacity:.35}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:8px}
.tile{appearance:none;font:inherit;color:var(--ink);text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:center}
.tile b{font:700 20px var(--display);text-transform:uppercase;letter-spacing:.03em}
.tile small{grid-column:1;font-size:12.5px;color:var(--muted)}
.tile .c{grid-column:2;grid-row:1/span 2;font:700 22px var(--body);font-variant-numeric:tabular-nums;color:var(--muted);min-width:36px;text-align:center}
.tile.wr{border-color:#facc15;background:rgba(250,204,21,.18)}.tile.mine{border-color:#14b8a6;background:var(--teal-soft)}.tile.wr .c,.tile.mine .c{color:inherit}
.section{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.section h3{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);font:700 19px var(--display);letter-spacing:.03em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;font:600 12px var(--body);padding:1px 8px;border-radius:999px;white-space:nowrap;letter-spacing:0}
.p-red{background:var(--red-soft);color:var(--red)}.p-amber{background:var(--amber-soft);color:var(--amber)}.p-blue{background:var(--blue-soft);color:var(--blue)}.p-green{background:var(--green-soft);color:var(--green)}.p-pink{background:var(--pink-soft);color:var(--pink)}.p-teal{background:var(--teal-soft);color:var(--teal)}
.grp{padding:8px 14px 4px;font:700 13px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;scroll-margin-top:80px}
.row{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.em{border-left:5px solid #dc2626;background:rgba(220,38,38,.08)}
.row a{font:600 13px var(--mono);color:var(--accent);text-decoration:none;padding-top:1px}
.row .nm{font-weight:600}
.row .meta{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12.5px;color:var(--muted);align-items:center}
.fresh{font:500 12px var(--body);text-transform:none;letter-spacing:0;color:var(--muted)}
.msg{padding:14px;color:var(--muted)}
.keybox{max-width:520px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:10px}
.keybox input{font:16px var(--mono);padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));border-bottom:1px solid var(--line)}
.sum div{padding:10px 14px;display:grid}.sum div+div{border-left:1px solid var(--line)}
.sum b{font:700 30px var(--display);font-variant-numeric:tabular-nums;line-height:1.1}.sum span{font-size:12.5px;color:var(--muted)}
.sum .late b{color:var(--red)}.sum .done b{color:var(--blue)}.sum .rec b{color:var(--amber)}
.techbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;padding:12px 14px}
.techbtn{appearance:none;font:inherit;color:var(--ink);text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:auto auto;justify-content:start;gap:2px 14px}
.techbtn:hover{border-color:var(--accent)}
.techbtn .tn{grid-column:1/-1;font:700 20px var(--display);text-transform:uppercase;letter-spacing:.02em}
.techbtn .tc{font-size:14px;color:var(--muted)}.techbtn .tc b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}.techbtn .tc.late b{color:var(--red)}
body.tv .sum b{font-size:40px}body.tv .techbtn .tn{font-size:26px}body.tv .techbtn .tc{font-size:17px}body.tv .techbtn .tc b{font-size:22px}
.bigcounts .big{padding:22px 24px;display:grid;gap:2px;border-bottom:1px solid var(--line)}.bigcounts .big:last-child{border-bottom:0}
.bigcounts .big b{font:700 120px/1 var(--display);font-variant-numeric:tabular-nums}
.bigcounts .big span{font:600 22px var(--body);color:var(--muted)}
.bigcounts .big.late b,.bigcounts .big.late span{color:var(--red)}.bigcounts .big.ok b{color:var(--green)}.bigcounts .big.done b{color:var(--blue)}
.stat{border-top:1px solid var(--line);padding:10px 14px 14px}.stat h4{margin:0 0 8px;font:600 13px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.stat h4 b{color:var(--ink)}
.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}.stgrid div{border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:grid}.stgrid b{font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}.stgrid span{font-size:12.5px;color:var(--muted)}
.stgrid .hv{background:var(--pink-soft)}.stgrid .hv b{color:var(--pink)}.stgrid .hp{background:var(--amber-soft)}.stgrid .hp b{color:var(--amber)}.stgrid .hh{background:var(--red-soft)}.stgrid .hh b{color:var(--red)}.stgrid .zero{opacity:.55}
body.tv .stat h4{font-size:16px}body.tv .stgrid b{font-size:34px}body.tv .stgrid span{font-size:15px}body.tv .stgrid{grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
.msgscreen{min-height:calc(100vh - 120px);display:flex;flex-direction:column;justify-content:center;gap:28px;padding:40px 60px;background:var(--surface);border:1px solid var(--line);border-left:16px solid var(--accent);border-radius:14px}
.msgscreen .mtag{font:700 28px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.msgscreen .mtext{margin:0;font:700 clamp(36px,5vw,96px)/1.12 var(--display);color:var(--ink);text-wrap:balance}
.msgscreen .mfrom{font:600 24px var(--body);color:var(--muted)}
.msgscreen.urgent{border-left-color:var(--red);background:var(--red-soft)}.msgscreen.urgent .mtag{color:var(--red)}
body.tv .msgscreen{min-height:1000px}body.tv .msgscreen .mtext{font-size:96px}
.bigcounts .team{display:grid}.bigcounts .tr{display:flex;align-items:baseline;gap:16px;padding:10px 24px;border-top:1px solid var(--line)}
.bigcounts .tr b{font:700 54px/1 var(--display);color:var(--blue);font-variant-numeric:tabular-nums;min-width:2.2ch}.bigcounts .tr span{font:600 20px var(--body);color:var(--muted)}
.bigcounts .tr.rec b{color:var(--amber)}
body.tv .bigcounts .big{padding:17px 24px}body.tv .bigcounts .big b{font-size:150px}body.tv .bigcounts .big span{font-size:28px}
body.tv .bigcounts .tr{padding:11px 24px}body.tv .bigcounts .tr b{font-size:70px}body.tv .bigcounts .tr span{font-size:26px}
body.tv .sum{grid-template-columns:repeat(3,1fr)}
/* A tech's buildings with past-due work flash red. */
.pin.mine.late{border-color:#ef4444;background:rgba(239,68,68,.4);box-shadow:0 0 0 3px rgba(0,0,0,.4),0 0 24px 8px #ef4444}.pin.mine.late::after{background:#dc2626;color:#fff}
.tile.mine.late{border-color:#ef4444;background:rgba(239,68,68,.16)}.tile.mine.late .c{color:var(--red)}
@media (prefers-reduced-motion:no-preference){.pin.late,.tile.late{animation:blink .8s steps(2,jump-none) infinite}}
/* TV mode */
body.tv header,body.tv .lede,body.tv .chips,body.tv .tvbar{display:none!important}
body.tv{font-size:18px}body.tv main .wrap{max-width:none;padding-block:12px 20px}body.tv h2{margin-top:0}
body.tv h2{font-size:46px}body.tv .row .nm{font-size:20px}body.tv .row .meta{font-size:15px}
body.tv .section{max-height:none}body.tv .grid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}
#tvui .bar{position:fixed;left:0;right:0;bottom:0;height:6px;background:var(--accent);transform-origin:left;z-index:30}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#tvui .ctl{position:fixed;right:12px;bottom:14px;display:flex;gap:10px;align-items:center;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 12px;font-size:14px;color:var(--muted)}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:none}.hbtns .btn{white-space:nowrap}header .wrap>div{min-width:0}
@media (max-width:720px){header .wrap{flex-wrap:wrap}.hbtns{width:100%;justify-content:flex-start}}
body.oneslide #tvui .bar,body.oneslide #tvstep{display:none}
/* Manager mode */
body.tv:not(.mgr) .pin,body.tv:not(.mgr) .tile,body.tv:not(.mgr) .techbtn{cursor:default}
.mgronly{display:none}body.mgr .mgronly{display:inline-flex}body.mgr #tvui .bar{display:none}body.mgr #tvui .ctl{border-color:var(--accent)}
#pinpad,#wolist{position:fixed;inset:0;z-index:60;background:rgba(10,15,20,.55);display:grid;place-items:center;padding:16px}
.pinbox{background:var(--surface);color:var(--ink);border-radius:16px;padding:28px;width:min(420px,100%);display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.pinbox h3{margin:0;font:700 30px var(--display);text-transform:uppercase;text-align:center}
.pindots{display:flex;justify-content:center;gap:16px}.pindots i{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted)}.pindots i.on{background:var(--ink);border-color:var(--ink)}
.pinmsg{margin:0;min-height:20px;text-align:center;color:var(--red);font-weight:600}
.pinkeys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pinkeys button{font:700 30px var(--display);padding:16px 0;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.pinkeys button[data-pin="C"],.pinkeys button[data-pin="X"]{font:600 16px var(--body)}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
.wobox{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px 26px;width:min(1200px,100%);max-height:88vh;display:flex;flex-direction:column;gap:6px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.wobox h3{margin:0;display:flex;justify-content:space-between;align-items:center;gap:12px;font:700 34px var(--display);text-transform:uppercase}
.wosub{margin:0 0 6px;color:var(--muted);font-size:18px}.wosub .late{color:var(--red)}
.wolistrows{overflow:auto;display:grid;gap:8px}
.wo{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
.wo.od{border-color:var(--red);background:var(--red-soft)}.wid{font:600 16px var(--mono);color:var(--muted);grid-row:span 2}.wn{font:600 22px var(--body)}
.wm{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:16px;color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap"><div><h1>Technician Work Order Board</h1><span>Open work by building · live from Limble</span></div><span class="hbtns"><button class="btn" type="button" data-sound="normal">Test chime</button><button class="btn" type="button" data-sound="urgent">Test emergency sound</button><button class="btn primary" id="tvbtn" type="button">Display mode</button></span></div></header>
<main><div class="wrap" id="view"><p class="msg">Loading…</p></div></main>
<script>
const API="https://limble-connector.siemonsmas.workers.dev/api/tech-board";
const PINS={M1:[30.75,4.1],M:[38.6,4.1],I:[72.6,8.1],J:[82.9,4.7],K:[27.8,26.4],L:[16.9,31.7],H:[82.25,23.1],G:[78.1,30.2],A:[89.4,33.8],F:[82.6,36.1],E:[76.4,41.2],D:[71.25,57.7],C:[82.1,73.9],B:[90.25,73.9],SFA:[7.4,16.6],Z:[18.8,90.6],X:[43.25,91.1]};
const CODES=["A","B","C","D","E","F","G","H","I","J","J1","K","L","M","M1","SFA","X","Z","MOB","GEN"];
const AREAS=[["MOB","Mobile equipment","Forklifts, trucks, trailers, carts"],["GEN","General requests","Campus-wide and no building"]];
const LEVEL={emergency:["Emergency","p-red"],high:["High","p-pink"],medium:["Medium","p-blue"],low:["Low","p-green"]};
// Seconds on each display screen: the main board stays up longer, each tech goes by quickly.
const SECS={main:45,tech:10,msg:20},REFRESH=15000;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
const view=document.getElementById("view");
// The board key comes in the link (#key=...) once, then this device remembers it and drops it from the address bar.
const hp=new URLSearchParams(location.hash.slice(1));if(hp.get("key")){store.set("tb-key",hp.get("key"));history.replaceState(null,"",location.pathname+location.search)}
const qp=new URLSearchParams(location.search);
let KEY=store.get("tb-key"),DATA=null,ERR="",sel=qp.get("tech")||store.get("tb-tech")||"",tv=false,tvIdx=0,tvTimer=null,lock=null;
if(qp.get("tv")==="1")setTimeout(()=>startTV(),300);
const name=k=>k==="MOB"?"Mobile equipment":k==="GEN"?"General requests":"Building "+k;
function monthName(m){return new Date(m+"-15T12:00:00Z").toLocaleDateString("en-US",{month:"long",year:"numeric",timeZone:"UTC"})}
function teamRows(){if(!DATA||!("teamDone" in DATA))return"";const rec=DATA.record,isNew=rec&&rec.month===DATA.month;
  return `<div class="team"><div class="tr"><b>${DATA.teamDone}</b><span>Team completed this week</span></div>${"monthDone" in DATA?`<div class="tr"><b>${DATA.monthDone}</b><span>Team completed in ${esc(monthName(DATA.month).split(" ")[0])} so far</span></div>`:""}${rec?`<div class="tr rec"><b>${rec.count}</b><span>${isNew?"New monthly record, this month!":"Monthly record ("+esc(monthName(rec.month))+")"}</span></div>`:""}</div>`}
function statusBlock(){const st=DATA&&DATA.statusCounts;if(!st||!st.length)return"";const tot=st.reduce((a,x)=>a+x.count,0);
  const cls=n=>/vendor/i.test(n)?"hv":/part/i.test(n)?"hp":/hold/i.test(n)?"hh":"";
  return `<div class="stat"><h4>All open work orders by status <b>${tot}</b></h4><div class="stgrid">${st.map(x=>`<div class="${cls(x.name)}${x.count?"":" zero"}"><b>${x.count}</b><span>${esc(x.name)}</span></div>`).join("")}</div></div>`}
// Sounds for board messages, made in the browser (no sound files). Standard: a soft two-note chime.
// Urgent / shop emergency: three rounds of a sharp high-low alert tone. Browsers only allow sound after
// someone has tapped the page once, so starting display mode with the button unlocks it.
let AC=null;
function unlockSound(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
function tone(f,t0,dur,type,vol){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+dur+.05)}
function playMsgSound(level){unlockSound();if(!AC)return;const t=AC.currentTime+.05;
  if(level==="urgent"){for(let k=0;k<3;k++){const b=t+k*0.9;tone(988,b,.22,"square",.18);tone(740,b+.25,.22,"square",.18);tone(988,b+.5,.22,"square",.18)}}
  else{tone(880,t,1.4,"sine",.35);tone(1318.5,t+.28,1.8,"sine",.3)}}
function checkNewMessage(){const M=DATA&&DATA.message;if(!M)return;const id=(M.at||"")+"|"+(M.text||"");if(store.get("tb-msg-seen")===id)return;store.set("tb-msg-seen",id);
  playMsgSound(M.level);if(tv){tvIdx=0;setTimeout(show,0)}}
function msgView(M){const when=new Date(M.at).toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZone:"America/Chicago"});
  return `<div class="msgscreen ${M.level==="urgent"?"urgent":""}"><div class="mtag">${M.level==="urgent"?"Urgent message":"Message to the team"}</div><p class="mtext">${esc(M.text).replace(/\n/g,"<br>")}</p><div class="mfrom">${esc(M.from||"Clint")} · ${esc(when)}</div></div>`}
function ago(iso){const s=Math.max(0,(Date.now()-new Date(iso))/1000);return s<60?"just now":s<3600?Math.floor(s/60)+" min ago":Math.floor(s/3600)+" h ago"}
async function load(){
  if(!KEY){render();return}
  try{const r=await fetch(API,{headers:{Authorization:"Bearer "+KEY},cache:"no-store"});const j=await r.json().catch(()=>({}));
    if(!r.ok){ERR=j.error||"Couldn't load the board ("+r.status+").";if(r.status===401){store.set("tb-key","");KEY=""}}else{DATA=j;ERR="";checkNewMessage()}}
  catch(e){ERR="Can't reach the board right now. It will try again in a few seconds."}
  if(tv&&mgr)mgrRender();
  else if(tv){const sl=slides();if(tvIdx>=sl.length){tvIdx=0;show()}else{render(sl[tvIdx]);const st=document.getElementById("tvstep");if(st)st.textContent=`${tvIdx+1} of ${sl.length}`}}else render();
}
function row(r){const l=LEVEL[r.level];return `<div class="row${r.level==="emergency"?" em":""}"><a href="https://app.limblecmms.com/taskList?taskID=${encodeURIComponent(r.id)}" target="_blank" rel="noopener">#${esc(r.id)}</a><span class="nm">${esc(r.name)}</span><span class="meta">${l?`<span class="pill ${l[1]}">${l[0]}</span>`:""}${r.overdue?`<span class="pill p-red">Overdue</span>`:""}${r.due?`<span>Due ${esc(r.due)}</span>`:""}<span>${esc(r.status)}</span>${r.kind?`<span>${esc(r.kind)}</span>`:""}${r.where?`<span>${esc(r.where)}</span>`:""}${r.with&&r.with.length?`<span>With ${esc(r.with.join(", "))}</span>`:""}</span></div>`}
function block(items,cls,title,pill,side){
  const by={};items.forEach(r=>(by[r.area]=by[r.area]||[]).push(r));
  const pins=Object.keys(PINS).map(c=>{const n=(by[c]||[]).length,late=cls==="mine"&&(by[c]||[]).some(r=>r.overdue);return `<button class="pin ${n?cls:""}${late?" late":""}" ${n?`data-n="${n}"`:""} data-go="${c}" style="left:${PINS[c][0]}%;top:${PINS[c][1]}%" aria-label="Building ${c}${n?", "+n:""}"></button>`}).join("");
  const tiles=AREAS.map(([k,l,s])=>{const n=(by[k]||[]).length,late=cls==="mine"&&(by[k]||[]).some(r=>r.overdue);return `<button class="tile ${n?cls:""}${late?" late":""}" data-go="${k}"><b>${l}</b><small>${s}</small><span class="c">${n}</span></button>`}).join("");
  const groups=CODES.filter(c=>by[c]).map(c=>`<div class="grp" id="g-${c}">${esc(name(c))} <span class="pill ${cls==="wr"?"p-amber":"p-teal"}">${by[c].length}</span></div>${by[c].map(row).join("")}`).join("");
  return `<div class="grid"><div><div class="mapbox"><div class="aerial"><img src="map.jpg" alt="Aerial campus map with building labels" width="2400" height="1800">${pins}</div></div><div class="tiles">${tiles}</div></div>
  ${side||`<section class="section"><h3><span>${title} ${pill}</span><span class="fresh">${DATA?"Updated "+esc(ago(DATA.asOf)):""}</span></h3>${ERR?`<p class="msg">${esc(ERR)}</p>`:""}${groups||`<p class="msg">${cls==="wr"?"No waiting work requests. Everything has someone on it.":"No open work orders assigned right now."}</p>`}</section>`}</div>`;
}
function render(slide){
  if(!KEY){view.innerHTML=`<form class="keybox" id="keyform"><h2>Board key</h2><p class="lede">This screen needs the board key from Clint. Paste it once; this device remembers it.</p><input id="k" autocomplete="off" aria-label="Board key"><button class="btn primary">Open the board</button>${ERR?`<p class="lede">${esc(ERR)}</p>`:""}</form>`;return}
  if(!DATA){view.innerHTML=`<p class="msg">${esc(ERR||"Loading work orders from Limble…")}</p>`;return}
  const s=slide||(sel?{tech:sel}:{});
  if(s.msg&&DATA.message){view.innerHTML=msgView(DATA.message);return}
  const t=s.tech&&DATA.techs.find(x=>String(x.id)===String(s.tech));
  const back=`<div class="chips"><button class="chip" data-tech="">← All technicians</button></div>`;
  const totOpen=DATA.techs.reduce((a,x)=>a+x.open,0),totLate=DATA.techs.reduce((a,x)=>a+x.overdue,0);
  const side=`<section class="section"><h3><span>Technicians</span><span class="fresh">${DATA?"Updated "+esc(ago(DATA.asOf)):""}</span></h3>${ERR?`<p class="msg">${esc(ERR)}</p>`:""}
    <div class="sum"><div><b>${DATA.waiting.length}</b><span>Waiting requests</span></div><div><b>${totOpen}</b><span>Assigned open</span></div><div class="${totLate?"late":""}"><b>${totLate}</b><span>Past due</span></div>${"teamDone" in DATA?`<div class="done"><b>${DATA.teamDone}</b><span>Team completed this week</span></div>`:""}${"monthDone" in DATA?`<div class="done"><b>${DATA.monthDone}</b><span>Completed in ${esc(monthName(DATA.month).split(" ")[0])} so far</span></div>`:""}${DATA.record?`<div class="rec"><b>${DATA.record.count}</b><span>Monthly record (${esc(monthName(DATA.record.month))})</span></div>`:""}</div>
    <div class="techbtns">${DATA.techs.map(x=>`<button class="techbtn" data-tech="${x.id}"><span class="tn">${esc(x.name)}</span><span class="tc"><b>${x.open}</b> open</span><span class="tc ${x.overdue?"late":""}"><b>${x.overdue}</b> past due</span></button>`).join("")}</div>${statusBlock()}</section>`;
  const chips=`<div class="chips"><button class="chip" data-tech="" aria-pressed="${!sel}">Waiting requests <span class="n">${DATA.waiting.length}</span></button>${DATA.techs.map(x=>`<button class="chip" data-tech="${x.id}" aria-pressed="${String(x.id)===String(sel)}">${esc(x.name)} <span class="n">${x.open}</span></button>`).join("")}</div>`;
  const counts=t&&`<section class="section bigcounts"><h3><span>${esc(t.name)}</span><span class="fresh">${DATA?"Updated "+esc(ago(DATA.asOf)):""}</span></h3><div class="big"><b>${t.open}</b><span>Work order${t.open===1?"":"s"} in ${esc(t.name.split(" ")[0])}'s name</span></div><div class="big ${t.overdue?"late":"ok"}"><b>${t.overdue}</b><span>Past due</span></div>${teamRows()}</section>`;
  if(t)view.innerHTML=`<h2>${esc(t.name)}</h2><p class="lede">Teal buildings have open work assigned to ${esc(t.name.split(" ")[0])}; the number is how many. Tap one to jump to its list.</p>${back}${block(t.items,"mine",esc(t.name),`<span class="pill p-teal">${t.open} open</span>${t.overdue?` <span class="pill p-red">${t.overdue} overdue</span>`:""}`,tv?counts:"")}`;
  else view.innerHTML=`<h2>Waiting work requests</h2><p class="lede">Technician-team work requests in Limble that nobody has picked up flash yellow. Tap your name to see your buildings.</p>${block(DATA.waiting,"wr","Waiting work requests",`<span class="pill p-amber">${DATA.waiting.length}</span>`,side)}`;
}
document.addEventListener("submit",e=>{if(e.target.id==="keyform"){e.preventDefault();const v=document.getElementById("k").value.trim();if(v){KEY=v;store.set("tb-key",v);ERR="";load()}}});
document.addEventListener("click",e=>{
  const pk=e.target.closest("[data-pin]");if(pk){pinKey(pk.dataset.pin);return}
  if(e.target.closest("[data-close]")||e.target.id==="wolist"){closeModal();mgrTouch();return}
  if(e.target.closest("[data-mgr]")){if(mgr)mgrLock();else openPin();return}
  if(tv){mgrTouch();
    const tc=e.target.closest("[data-tech]"),go=e.target.closest("[data-go]");
    if((tc||go)&&!mgr){openPin(()=>{if(tc&&tc.dataset.tech){mgrView={tech:tc.dataset.tech};mgrRender()}else if(go)openArea(go.dataset.go)});return}
    if(tc){mgrView=tc.dataset.tech?{tech:tc.dataset.tech}:{};closeModal();mgrRender();return}
    if(go){openArea(go.dataset.go);return}
  }
  const c=e.target.closest("[data-tech]");if(c){sel=c.dataset.tech;store.set("tb-tech",sel);render();return}
  const g=e.target.closest("[data-go]");if(g&&!tv){const el=document.getElementById("g-"+g.dataset.go);if(el)el.scrollIntoView({block:"start",behavior:"smooth"})}
  if(e.target.closest("#tvbtn"))startTV();const snd=e.target.closest("[data-sound]");if(snd)playMsgSound(snd.dataset.sound);unlockSound();if(e.target.closest("[data-tvexit]"))stopTV();
});
// Display mode: the main screen only, plus any board message. Data refreshes every 15 seconds without restarting the current screen.
// Display mode stays on the main screen. When a board message is up, it alternates: message 20 s, main 45 s.
function slides(){return [...(DATA&&DATA.message?[{msg:1}]:[]),{}]}
// Manager mode (for meetings): on the display, a password unlocks clicking. Buildings open their work
// orders; a tech opens their screen; on a tech's screen, a building opens that tech's work there.
// The password is checked in the browser, so it only keeps casual hands off the TV; it is not a real lock.
const MGR_PIN="1234",MGR_IDLE=5*60000;
let mgr=false,mgrView={},mgrIdle=null,pinBuf="",pinNext=null;
function mgrTouch(){clearTimeout(mgrIdle);if(mgr)mgrIdle=setTimeout(mgrLock,MGR_IDLE)}
function mgrUnlock(){mgr=true;mgrView={};clearTimeout(tvTimer);document.body.classList.add("mgr");closePin();mgrTouch();mgrRender();updMgrBtn();if(pinNext){const f=pinNext;pinNext=null;f()}}
function mgrLock(){mgr=false;clearTimeout(mgrIdle);document.body.classList.remove("mgr");closeModal();updMgrBtn();if(tv){tvIdx=0;show()}}
function updMgrBtn(){const b=document.getElementById("mgrbtn");if(b)b.textContent=mgr?"Lock manager mode":"Manager mode"}
function mgrRender(){render(mgrView);const st=document.getElementById("tvstep");if(st)st.textContent=mgrView.tech?"Manager mode · tech screen":"Manager mode"}
function openPin(next){pinNext=next||null;pinBuf="";closePin();const d=document.createElement("div");d.id="pinpad";d.innerHTML=`<div class="pinbox" role="dialog" aria-label="Manager password"><h3>Manager password</h3><div class="pindots" id="pindots"></div><p class="pinmsg" id="pinmsg"></p><div class="pinkeys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-pin="${n}">${n}</button>`).join("")}<button data-pin="C">Clear</button><button data-pin="0">0</button><button data-pin="X">Cancel</button></div></div>`;document.body.appendChild(d);pinDots()}
function closePin(){document.getElementById("pinpad")?.remove()}
function pinDots(){const d=document.getElementById("pindots");if(d)d.innerHTML=[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?"on":""}"></i>`).join("")}
function pinKey(k){if(k==="X"){closePin();pinNext=null;return}if(k==="C"){pinBuf="";pinDots();return}if(pinBuf.length>=8)return;pinBuf+=k;pinDots();
  if(pinBuf.length>=MGR_PIN.length){if(pinBuf===MGR_PIN)mgrUnlock();else{pinBuf="";pinDots();const m=document.getElementById("pinmsg");if(m)m.textContent="Wrong password. Try again.";document.querySelector(".pinbox")?.classList.remove("shake");void document.querySelector(".pinbox")?.offsetWidth;document.querySelector(".pinbox")?.classList.add("shake")}}}
function closeModal(){document.getElementById("wolist")?.remove()}
function openArea(code){
  const t=mgrView.tech&&DATA.techs.find(x=>String(x.id)===String(mgrView.tech));let list=[],title;
  if(t){list=t.items.filter(r=>r.area===code);title=`${esc(t.name)} · ${esc(name(code))}`}
  else{const m=new Map();DATA.waiting.filter(r=>r.area===code).forEach(r=>m.set(r.id,{...r,who:["Waiting for a tech"]}));
    DATA.techs.forEach(x=>x.items.filter(r=>r.area===code).forEach(r=>{const e=m.get(r.id);if(e)e.who.push(x.name);else m.set(r.id,{...r,who:[x.name]})}));
    list=[...m.values()];title=`${esc(name(code))} · all open work`}
  list.sort((a,b)=>(b.overdue-a.overdue)||String(a.due||"9").localeCompare(String(b.due||"9")));
  closeModal();const d=document.createElement("div");d.id="wolist";d.dataset.code=code;d.innerHTML=`<div class="wobox" role="dialog"><h3><span>${title}</span><button class="btn" data-close>Close</button></h3><p class="wosub">${list.length} open${list.filter(r=>r.overdue).length?` · <b class="late">${list.filter(r=>r.overdue).length} past due</b>`:""}</p><div class="wolistrows">${list.map(r=>{const l=LEVEL[r.level];return `<div class="wo${r.overdue?" od":""}"><span class="wid">#${esc(r.id)}</span><span class="wn">${esc(r.name)}</span><span class="wm">${l?`<span class="pill ${l[1]}">${l[0]}</span>`:""}${r.overdue?`<span class="pill p-red">Past due</span>`:""}${r.due?`<span>Due ${esc(r.due)}</span>`:""}<span>${esc(r.status)}</span>${r.kind?`<span>${esc(r.kind)}</span>`:""}${r.who?`<span>${esc(r.who.join(", "))}</span>`:""}${r.with&&r.with.length?`<span>with ${esc(r.with.join(", "))}</span>`:""}</span></div>`}).join("")||`<p class="msg">Nothing open here.</p>`}</div></div>`;document.body.appendChild(d)}
function slideSecs(x){return x&&x.msg?SECS.msg:x&&x.tech?SECS.tech:SECS.main}
function show(){if(mgr){mgrRender();return}const sl=slides();if(tvIdx>=sl.length)tvIdx=0;render(sl[tvIdx]);const TV_SECS=slideSecs(sl[tvIdx]);clearTimeout(tvTimer);tvTimer=setTimeout(()=>{tvIdx++;show()},TV_SECS*1000);const b=document.querySelector("#tvui .bar");if(b){b.style.animation="none";void b.offsetWidth;b.style.animation=`fill ${TV_SECS}s linear`}const st=document.getElementById("tvstep");if(st)st.textContent=`${tvIdx+1} of ${sl.length}`;document.body.classList.toggle("oneslide",sl.length<2)}
async function startTV(){if(tv||!DATA)return;unlockSound();tv=true;document.body.classList.add("tv");fitTV();tvIdx=0;
  const ui=document.createElement("div");ui.id="tvui";ui.innerHTML='<div class="bar"></div><div class="ctl"><span id="tvstep"></span><button class="btn mgronly" data-tech="">← Main screen</button><button class="btn" id="mgrbtn" data-mgr>Manager mode</button><button class="btn" data-tvexit>Exit display mode</button></div>';document.body.appendChild(ui);
  try{await document.documentElement.requestFullscreen()}catch(e){}try{lock=await navigator.wakeLock.request("screen")}catch(e){}
  show()}
function fitTV(){document.body.style.zoom=tv?String(Math.min(innerWidth/1920,innerHeight/1080)):""}
addEventListener("resize",fitTV);
function stopTV(){if(!tv)return;if(mgr){mgr=false;clearTimeout(mgrIdle);document.body.classList.remove("mgr");closeModal()}closePin();tv=false;fitTV();clearTimeout(tvTimer);document.body.classList.remove("tv");document.getElementById("tvui")?.remove();try{lock&&lock.release()}catch(e){}try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}render()}
document.addEventListener("keydown",e=>{if(document.getElementById("pinpad")){if(/^[0-9]$/.test(e.key))pinKey(e.key);else if(e.key==="Backspace"){pinBuf=pinBuf.slice(0,-1);pinDots()}else if(e.key==="Escape")pinKey("X");return}if(e.key==="Escape"){if(document.getElementById("wolist"))closeModal();else if(mgr)mgrLock();else stopTV()}});
document.addEventListener("visibilitychange",async()=>{if(tv&&document.visibilityState==="visible"){try{lock=await navigator.wakeLock.request("screen")}catch(e){}}});
load();setInterval(load,REFRESH);
</script>
</body>
</html>
