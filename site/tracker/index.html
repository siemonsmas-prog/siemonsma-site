<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b111b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Projects">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Facilities Project Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: Siemonsma.org night look. Banner + summary tiles + project table; on wide screens the project detail docks as a right-hand panel, on phones it slides over. */
:root{
  --bg:#0b111b; --surface:#121a27; --sunk:#1a2436; --ink:#e9eef6; --muted:#97a6bb; --line:#26344c;
  --accent:#3d8bff; --accent-ink:#ffffff; --blue:#5c9dff; --bar:#3d8bff; --bar-ink:#ffffff;
  --ok:#41d07f; --warn:#f3b53f; --bad:#ff6363; --idle:#a3b0c2;
  --ok-bg:rgba(65,208,127,.16); --warn-bg:rgba(243,181,63,.16); --bad-bg:rgba(255,99,99,.16); --idle-bg:rgba(163,176,194,.14);
  --c-con:#ffa463; --c-con-bg:rgba(255,164,99,.15); --c-mnt:#7db2ff; --c-mnt-bg:rgba(125,178,255,.15); --c-cus:#4fd6bd; --c-cus-bg:rgba(79,214,189,.15); --c-pur:#b99bff; --c-pur-bg:rgba(185,155,255,.15);
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --panel:min(540px,40vw); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding-inline:clamp(16px,2.4vw,28px);padding-block:0 96px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);color:var(--ink);border-bottom:1px solid var(--line)}
.bar-in{max-width:1440px;margin:0 auto;padding:8px clamp(16px,2.4vw,28px);display:flex;align-items:center;gap:18px;min-height:60px}
.brand{font-family:var(--display);font-weight:900;font-stretch:125%;font-size:1.45rem;letter-spacing:.01em;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand span{color:var(--accent)}
.lockup{display:flex;flex-direction:column;gap:4px;text-decoration:none;flex:none}
.lockup .brand{line-height:1}
.powered{display:flex;align-items:center;gap:8px;font-size:.56rem;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.powered img{height:19px;width:auto;display:block}
.lockup .logo{height:48px;width:auto;display:block}
.logo-img{display:none}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav a,.nav span{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:6px;font-size:.92rem;text-decoration:none;color:var(--muted);white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--surface)}
.nav a[aria-current]{color:var(--blue);box-shadow:inset 0 -2px 0 var(--accent);border-radius:6px 6px 0 0}
.nav span{opacity:.5;cursor:default}
.nav svg{width:18px;height:18px;flex:none}
.me{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);min-width:0;border-left:1px solid var(--line);padding-left:14px!important}
.me img{width:28px;height:28px;border-radius:50%}
.me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
@media (max-width:1100px){.nav span{display:none}}
@media (max-width:640px){.bar-in{gap:10px}.lockup .logo{height:32px}.brand{font-size:1.1rem}.powered{font-size:.5rem;letter-spacing:.24em;gap:6px}.powered img{height:15px}.nav{margin-left:auto}.nav a{padding:8px}.nav a b{display:none}.me span{display:none}.me{padding-left:8px!important}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:7px;color:var(--ink);text-decoration:none}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.btn.primary.small{text-transform:none;letter-spacing:0}
.btn.ghost{background:transparent;border-color:transparent;color:var(--blue)}
.btn.small{min-height:34px;padding:5px 10px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:default}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;color:var(--muted);font-weight:600}
.section{margin-top:22px;display:grid;gap:10px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;min-width:0;text-align:left;cursor:pointer}
.card:hover{border-color:var(--muted)}
.card h3{font-size:1.25rem}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta{color:var(--muted);font-size:.88rem}
.tag{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.78rem;padding:2px 8px;border-radius:4px;background:var(--sunk);color:var(--ink)}
.cat-construction{background:var(--c-con-bg);color:var(--c-con)} .cat-maintenance{background:var(--c-mnt-bg);color:var(--c-mnt)} .cat-custodial{background:var(--c-cus-bg);color:var(--c-cus)} .cat-purchasing{background:var(--c-pur-bg);color:var(--c-pur)}
.card{box-shadow:0 1px 3px rgba(19,34,58,.06)}

.pill{font-size:.8rem;font-weight:600;padding:2px 9px;border-radius:999px}
.s-ok{background:var(--ok-bg);color:var(--ok)} .s-warn{background:var(--warn-bg);color:var(--warn)}
.s-bad{background:var(--bad-bg);color:var(--bad)} .s-idle{background:var(--idle-bg);color:var(--idle)}
.code{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.prog{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#3d8bf0)}
.due{border-left:5px solid var(--accent)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
label.ck{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;min-width:0}
label.ck:has(input:checked){border-color:var(--ink);background:var(--sunk)}
label.ck input{width:20px;height:20px;accent-color:var(--ink);flex:none;margin:0}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.file{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;min-width:0}
.file a.thumb{display:block;text-decoration:none;aspect-ratio:4/3;background:var(--sunk);max-width:100%}
.file a.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.file .doc{display:flex;align-items:center;justify-content:center;height:100%;font-family:var(--display);font-weight:700;font-size:1.6rem;color:var(--muted);letter-spacing:.05em}
.file .fmeta{padding:8px 10px;display:grid;gap:2px;font-size:.85rem;min-width:0}
.file .fmeta b{overflow-wrap:anywhere;font-weight:600}
.contact{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.contact .lines{display:grid;gap:2px;min-width:0;font-size:.92rem}
.contact .lines span{user-select:all;overflow-wrap:anywhere}
.contact .copy{border:0;background:none;color:var(--blue);cursor:pointer;font-size:.85rem;padding:0 0 0 6px;user-select:none}
.minithumbs{display:flex;gap:6px;flex-wrap:wrap}
.minithumbs a{width:72px;height:72px;border-radius:6px;overflow:hidden;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:var(--muted);font-size:.85rem;text-decoration:none}
.minithumbs img{width:100%;height:100%;object-fit:cover}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;justify-items:start}
label.ck span{min-width:0;overflow-wrap:anywhere}
.p-plan{background:var(--bad-bg);color:var(--bad)} .p-mid{background:var(--warn-bg);color:var(--warn)} .p-late{background:var(--ok-bg);color:var(--ok)}
.pr-critical{background:#b3001b;color:#fff;box-shadow:0 0 0 2px rgba(255,99,99,.45)} .pr-urgent{background:#d63434;color:#fff} .pr-high{background:#c4561a;color:#fff} .pr-normal{background:#8a6a14;color:#fff3cf} .pr-low{background:#2f6b3f;color:#d8ffe4}
select.prio-sel{border:0;min-height:0;width:auto;padding:3px 22px 3px 10px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 11px) 55%,calc(100% - 7px) 55%;background-size:4px 4px;background-repeat:no-repeat}
select.prio-sel option{background:#fff;color:#13223a}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.list{border-collapse:collapse;width:100%;min-width:980px;font-size:.9rem}
table.list thead th{background:var(--sunk)}
table.list th{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:.8rem;color:var(--muted);text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
#fLocOther[hidden]{display:none}
table.list th .thsort{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;border-radius:4px}table.list th .thsort:hover{color:var(--ink)}table.list th .thsort:focus-visible{outline:2px solid var(--accent);outline-offset:2px}table.list th[aria-sort] .thsort{color:var(--ink)}table.list th .thsort i{font-style:normal;font-size:.7rem;opacity:.35}table.list th[aria-sort] .thsort i{opacity:1}
table.list td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr[data-open]{cursor:pointer} table.list tr[data-open]:hover td{background:var(--sunk)}
table.list td.num{text-align:right;font-variant-numeric:tabular-nums}
table.list td.nm{font-weight:600;min-width:200px}
table.list td.vis{min-width:150px}
.vlist{display:flex;flex-wrap:wrap;gap:4px}
.vchip{font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--idle-bg);color:var(--ink);white-space:nowrap}
.pickrow{display:flex;gap:8px;align-items:center;padding:6px 6px 6px 12px;border:1px solid var(--ink);border-radius:8px;background:var(--sunk);min-width:0}
#vpAdd{margin-top:8px}
.checks.picks{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.vchip.vg{background:var(--sunk);color:var(--blue)} .vchip.vc{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.vchip.vg .meta{font-size:.75rem}
.nudge{background:var(--surface);border:2px dashed var(--accent);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;color:var(--muted);text-align:center}
.notice{background:var(--warn-bg);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:.92rem}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,11,.45);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(720px,100%);height:100%;overflow-y:auto;padding:0 16px calc(32px + env(safe-area-inset-bottom,0px));box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.sheet-head{position:sticky;top:0;background:var(--bg);padding:calc(12px + env(safe-area-inset-top,0px)) 0 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:2}
.sheet-head h2{font-size:1.5rem;min-width:0;overflow-wrap:anywhere}
.sheet-head .btn{margin-left:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:12px;overflow-x:auto}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.kv{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:6px 14px;font-size:.95rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.stack{display:grid;gap:12px;margin-top:14px}
.field{display:grid;gap:4px}
.field label{font-weight:600;font-size:.95rem}
.field .hint{color:var(--muted);font-size:.85rem}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{min-height:84px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.pglist{display:grid;gap:6px}
details.pg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.pg>summary{padding:10px 14px;cursor:pointer;display:flex;gap:4px 10px;align-items:baseline;list-style:none;flex-wrap:wrap;min-height:44px;box-sizing:border-box}
details.pg>summary::-webkit-details-marker{display:none}
details.pg>summary::before{content:"\25B8";color:var(--muted);width:12px;flex:none}
details.pg[open]>summary::before{content:"\25BE"}
details.pg .nm{font-weight:600}
details.pg .sub{color:var(--muted);font-size:.88rem;margin-left:auto}
details.pg .contact{border-bottom:0;padding:0 14px 12px 36px}
details.pg .pgb{display:grid;gap:10px;padding:0 14px 14px}
#pgSearch{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-height:44px;font:inherit}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.catpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.catpick button{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 12px;text-align:left;cursor:pointer;display:grid;gap:4px;min-width:0;container-type:inline-size}
.catpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--sunk)}
.catpick b{font-family:var(--display);font-size:1rem;font-size:min(1.25rem,11cqi);text-transform:uppercase;white-space:nowrap} /* shrinks with the card so CONSTRUCTION stays inside it */
.steps{display:flex;gap:6px;margin-top:12px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.timeline{display:grid;gap:10px;margin-top:14px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:6px;min-width:0}
.entry p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.entry .lbl{font-weight:600;font-size:.85rem;color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;font-size:.9rem}
.who img{width:24px;height:24px;border-radius:50%}
.answers{border-left:3px solid var(--line);padding-left:10px;display:grid;gap:8px;margin-top:4px}
.member{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.member img{width:32px;height:32px;border-radius:50%}
.member .nm{min-width:0;flex:1}
.ai{background:var(--sunk);border-radius:var(--r);padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;max-width:calc(100% - 32px)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;box-shadow:0 4px 14px rgba(0,0,0,.25)}
@media (min-width:700px){.fab{display:none}}
@media (max-width:699px){.desk-only{display:none}}
/* dashboard, needs attention, what's new */
.attn{display:grid;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:var(--r);overflow:hidden}
.attn-row{display:flex;gap:6px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.attn-row:last-child{border-bottom:0} .attn-row:hover{background:var(--sunk)}
.attn-row .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.why{display:flex;gap:6px;flex-wrap:wrap}
.card.new{border-left:5px solid var(--accent)}
td .why{margin-top:4px}
/* checklist */
details.ph{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.ph.cur{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
details.ph>summary{padding:12px 14px;cursor:pointer;display:flex;gap:8px;align-items:center;font-weight:600;list-style:none;flex-wrap:wrap}
details.ph>summary::-webkit-details-marker{display:none}
details.ph>summary::before{content:"\25B8";color:var(--muted);width:12px}
details.ph[open]>summary::before{content:"\25BE"}
details.ph .cnt{margin-left:auto;color:var(--muted);font-size:.88rem}
details.ph .cnt.all{color:var(--ok)}
.items{padding:0 14px 12px;display:grid}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.item label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.item input{width:22px;height:22px;accent-color:var(--ok);flex:none;margin:0}
.item span{overflow-wrap:anywhere}
.item.done span{text-decoration:line-through;color:var(--muted)}
.item .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.2rem;padding:2px 8px;line-height:1}
.addrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.addrow input{flex:1;min-width:160px}
.switch{display:flex;gap:10px;align-items:center;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--blue);margin:0}
/* status report */
.report>*{min-width:0}
.report{--ink:#13223a;--muted:#536179;--line:#d4e0ee;--blue:#1769d1;--surface:#fff;--sunk:#e8f1fb;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:16px;font-size:.92rem;min-width:0}
.report .rhead{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:3px solid var(--blue);padding-bottom:10px}
.report .rhead img{height:46px;width:auto}
.report h3{font-size:1.15rem;color:#0b2a6b;text-transform:uppercase;letter-spacing:.03em}
.report .tw{overflow-x:auto}
.report table{color:inherit;font-size:.85rem}
.report table{border-collapse:collapse;width:100%;min-width:640px;font-size:.85rem}
.report th{background:var(--blue);color:#fff;text-align:left;padding:6px 8px;font-weight:600;white-space:nowrap}
.report td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.report ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.report .ugrp{display:grid;gap:2px}

.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 40%,color-mix(in srgb,var(--bg) 60%,transparent) 56%,transparent 80%),linear-gradient(0deg,var(--bg),transparent 45%)}
.hero>*{position:relative;z-index:1}
.hero h1{font-family:var(--display);font-weight:900;font-stretch:125%;font-size:clamp(2rem,5.4vw,4rem);line-height:1;letter-spacing:.01em;text-transform:uppercase}
.hero p{margin:8px 0 0;font-size:clamp(1rem,1.7vw,1.3rem);color:var(--ink);max-width:46ch}
.actbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px}
.search{flex:1;min-width:200px;max-width:420px;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{padding-left:38px!important;background:color-mix(in srgb,var(--surface) 85%,transparent)!important}
/* summary tiles */
.dash{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:18px}
.tile{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;cursor:pointer;min-width:0;color:var(--ink)}
.tile .ti{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--sunk);color:var(--muted)}
.tile .ti svg{width:22px;height:22px}
.tile .tt{display:grid;min-width:0;flex:1}
.tile b{font-family:var(--display);font-size:1.7rem;line-height:1.05;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{font-size:.85rem;color:var(--muted);line-height:1.2}
.tile .chev{width:18px;height:18px;color:var(--muted);flex:none}
.tile:hover{border-color:var(--muted)}
.tile[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.tile.t-blue{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--surface)),var(--surface))} .tile.t-blue .ti{background:var(--accent);color:#fff}
.tile.t-bad{border-color:color-mix(in srgb,var(--bad) 50%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--bad) 13%,var(--surface)),var(--surface))} .tile.t-bad .ti{background:var(--bad);color:#fff}
.tile.t-warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--warn) 14%,var(--surface)),var(--surface))} .tile.t-warn .ti{background:var(--warn);color:#1b1300}
.tile.t-ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 12%,var(--surface)),var(--surface))} .tile.t-ok .ti{background:var(--ok);color:#06210f}
.tile.t-accent .ti{background:var(--sunk);color:var(--ink)}
@media (max-width:1180px){.dash{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.dash{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:10px}.tile .ti{width:34px;height:34px}.tile .chev{display:none}.tile b{font-size:1.4rem}}
/* project table panel */
.ptable{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ptable .phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.ptable .phead h2{font-size:1.35rem;margin-right:4px}
.ptable .phead select{width:auto;min-height:36px;padding:6px 10px;background:var(--sunk)}
.ptable .phead .sp{flex:1}
.ptable .tblwrap{border:0;border-radius:0}
.ptable .grid{padding:12px}
.ptable .empty{margin:14px}
table.list thead th{background:var(--sunk)}
table.list td{vertical-align:middle;padding:9px 10px}
table.list tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--sunk) 35%,transparent)}
table.list tr.sel td,table.list tr.sel:hover td{background:color-mix(in srgb,var(--accent) 24%,var(--surface))!important}
table.list td.idx{color:var(--muted);font-variant-numeric:tabular-nums;width:1%}
table.list td.dt{white-space:nowrap;font-variant-numeric:tabular-nums}
.st{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:4px;white-space:nowrap}
.st.s-ok{background:#1f5fd6;color:#fff} .st.s-warn{background:#a86c00;color:#fff} .st.s-bad{background:#c42f2f;color:#fff} .st.s-idle{background:#3a4860;color:#dfe6f1} .st.s-done{background:#1f7a46;color:#fff}
details.cols{position:relative}
details.cols>summary{list-style:none}
details.cols>summary::-webkit-details-marker{display:none}
details.cols .pop{position:absolute;right:0;top:calc(100% + 6px);z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:4px;min-width:220px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
details.cols .pop label{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:.92rem}
details.cols .pop label:hover{background:var(--sunk)}
details.cols .pop input{width:18px;height:18px;accent-color:var(--accent);margin:0}
/* detail panel: overview */
.stepper{display:flex;overflow-x:auto;padding:14px 4px 10px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r)}
.stepper .stp{flex:1 0 74px;display:grid;justify-items:center;gap:6px;position:relative;text-align:center;font-size:.72rem;color:var(--muted);padding:0 2px}
.stepper .stp::before{content:"";position:absolute;top:10px;left:-50%;right:50%;height:2px;background:var(--line)}
.stepper .stp:first-child::before{display:none}
.stepper .stp.done::before,.stepper .stp.cur::before{background:var(--accent)}
.stepper .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:var(--sunk);position:relative;z-index:1;display:grid;place-items:center}
.stepper .done .dot{background:var(--accent);border-color:var(--accent)}
.stepper .done .dot::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.stepper .cur .dot{border-color:#fff;box-shadow:0 0 0 3px var(--accent)}
.stepper .cur{color:var(--ink);font-weight:700}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{display:flex;gap:12px;align-items:center;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.fact svg{width:24px;height:24px;color:var(--muted);flex:none}
.fact div{display:grid;min-width:0}
.fact small{color:var(--muted);font-size:.78rem}
.fact b{font-size:1.02rem;overflow-wrap:anywhere}
@media (max-width:420px){.facts{grid-template-columns:1fr}}
.qlinks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qlinks button{display:grid;justify-items:center;gap:6px;padding:12px 6px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;font-size:.82rem;color:var(--ink)}
.qlinks button:hover{border-color:var(--accent)}
.qlinks svg{width:24px;height:24px}
@media (max-width:420px){.qlinks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.seg button svg{width:16px;height:16px;vertical-align:-3px}
.sec-h{font-family:var(--display);font-size:1.05rem;font-weight:700;margin:4px 0 -4px}
/* docked panel on wide screens */
@media (min-width:1200px){
  body.psplit{overflow:auto!important}
  body.psplit main.wrap{margin-right:calc(var(--panel) + 8px);max-width:none}
  body.psplit .scrim{background:transparent;pointer-events:none;top:63px}
  body.psplit .sheet{pointer-events:auto;width:var(--panel);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.35);animation:none}
  body.psplit .sheet-head{padding-top:12px}
  body.psplit .hero::before{width:min(70%,880px)}
  body.psplit .dash{grid-template-columns:repeat(3,minmax(0,1fr))}
}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:.78rem;font-weight:700;line-height:1}
.reqbar{display:flex;align-items:center;gap:14px;width:100%;margin-top:14px;padding:12px 16px;border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:var(--r);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--surface)),var(--surface));color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.reqbar:hover{border-color:var(--accent)}
.reqbar .ti{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:#fff;flex:none}
.reqbar .ti svg{width:22px;height:22px}
.reqbar .tt{display:grid;min-width:0;flex:1}
.reqbar .tt span{color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reqbar .go{color:var(--blue);font-weight:600;white-space:nowrap}
.rq .rqb{display:grid;gap:12px;padding:0 14px 14px}
.rq .desc{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunk);border-radius:8px;padding:10px 12px}
.rq .tag.urg-Urgent{background:var(--bad);color:#fff}
.rq .tag.urg-High{background:var(--warn-bg);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 2px 2px 12px;border:1px solid var(--line);border-radius:999px;background:var(--sunk);font-size:.92rem}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;min-width:32px;min-height:32px;border-radius:50%}
.chip button:hover{color:var(--bad)}

function lastScheduled(p,ref=new Date()){

  if(f==="weekly"){const d=sch.day??1;while(t.getDay()!==d)t.setDate(t.getDate()-1);return t}
  if(f==="biweekly"){const base=new Date(p.createdAt||ref);base.setHours(8,0,0,0);const n=Math.floor((t-base)/(14*864e5));return new Date(base.getTime()+Math.max(0,n)*14*864e5)}

/* ---------- apply updates from meeting notes ---------- */
// The file is JSON: {kind:"siemonsma-updates", source, changes:[{projectId, project, set:{status,phase,percent,priority,startDate,dueDate,nextMilestone,milestoneDate,budget}, note:{done,next,blockers}, why}]}
const APPLY_LABELS={status:"Status",phase:"Phase",percent:"% complete",priority:"Priority",startDate:"Start date",dueDate:"Target date",nextMilestone:"Next milestone",milestoneDate:"Milestone date",budget:"Budget"};
const isDay=v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||""));
const pick=(list,v)=>list.find(x=>low(x)===low(v));
function budgetKey(p){const f=CATS[p.category]?.fields.find(f=>f.k==="budget"||f.k==="cost");return f?.k||""}
function planChange(c){
  const p=S.projects.find(x=>x.id===c.projectId)||S.projects.find(x=>low(x.name)===low(c.project));
  const it={name:p?.name||c.project||"Unknown project",pid:p?.id||"",set:{},rows:[],note:{},why:String(c.why||"").slice(0,400),skipped:[]};
  if(!p){it.skipped.push("No project on your list matches this name.");return it}
  const set=c.set||{},bk=budgetKey(p);
  for(const [k,v] of Object.entries(set)){let val=null,old=p[k];
    if(k==="status")val=pick(STATUSES,v);else if(k==="phase")val=pick(phasesFor(p.category),v);else if(k==="priority")val=pick(PRIORITIES,v);
    else if(k==="percent"){const n=Math.round(Number(v));if(isFinite(n)&&n>=0&&n<=100)val=n}
    else if(["startDate","dueDate","milestoneDate"].includes(k)){if(isDay(v))val=v}
    else if(k==="nextMilestone"){if(typeof v==="string"&&v.trim())val=v.trim().slice(0,200)}
    else if(k==="budget"){const n=Number(String(v).replace(/[$,\s]/g,""));if(bk&&isFinite(n)&&n>=0){val=n;old=p.details?.[bk]}}
    if(val==null){it.skipped.push(`${APPLY_LABELS[k]||k}: "${v}" isn't something I can set here.`);continue}
    if(String(old??"")===String(val))continue;
    it.set[k]=val;it.rows.push([APPLY_LABELS[k],k==="percent"?(old??0)+"%":k==="budget"&&old?"$"+Number(old).toLocaleString():old||"—",k==="percent"?val+"%":k==="budget"?"$"+val.toLocaleString():val])}
  for(const k of ["done","next","blockers"]){const v=String(c.note?.[k]||"").trim();if(v)it.note[k]=v.slice(0,1000)}
  return it}
function renderApply(){const pl=S.applyPlan;
  const row=(it,i)=>{const has=it.rows.length||Object.keys(it.note).length,ok=it.pid&&has;
    return `<div class="pg applyit" style="padding:12px 14px;display:grid;gap:8px">
      <label class="row" style="gap:10px;align-items:flex-start"><input type="checkbox" data-apck="${i}" ${ok?"checked":"disabled"} style="margin-top:4px;width:20px;height:20px"><b style="font-size:1.05rem">${esc(it.name)}</b></label>
      ${it.rows.length?`<table class="aptab">${it.rows.map(([l,a,b])=>`<tr><td>${esc(l)}</td><td class="meta">${esc(a)}</td><td>→</td><td><b>${esc(b)}</b></td></tr>`).join("")}</table>`:""}
      ${[["done","Done"],["next","Next"],["blockers","Blockers"]].filter(([k])=>it.note[k]).map(([k,l])=>`<div><span class="meta">${l}:</span> ${esc(it.note[k])}</div>`).join("")}
      ${it.why?`<div class="meta" style="font-style:italic">From the notes: “${esc(it.why)}”</div>`:""}
      ${!has&&it.pid?`<div class="meta">Nothing new for this project.</div>`:""}
      ${it.skipped.map(x=>`<div class="meta" style="color:var(--bad)">${esc(x)}</div>`).join("")}</div>`};
  openSheet("apply",`<div class="sheet-head"><h2>Apply updates</h2><button class="btn small" data-act="close">Close</button></div>
  <div class="stack" style="margin-top:14px">
    <p class="meta" style="margin:0">Choose the update file Claude made from your meeting notes. You'll see every change first. Only the ones you leave ticked get saved, and each one is posted as an update on its project.</p>
    <label class="btn" style="justify-self:start">${IC.notes}${pl?"Choose a different file":"Choose update file"}<input type="file" id="applyFile" accept=".json,application/json" hidden></label>
    ${pl?`${pl.source?`<div class="meta">From: <b>${esc(pl.source)}</b></div>`:""}<div class="pglist">${pl.items.map(row).join("")||`<div class="empty">This file has no changes in it.</div>`}</div>
      <div class="row"><button class="btn primary" data-act="applyGo">Save ticked changes</button></div>`:""}
  </div>`)}
async function loadApplyFile(f){
  try{const j=JSON.parse(await f.text());if(j.kind!=="siemonsma-updates"||!Array.isArray(j.changes))throw new Error("bad");
    S.applyPlan={source:String(j.source||f.name).slice(0,200),items:j.changes.slice(0,100).map(planChange)};renderApply()}
  catch(e){toast("That isn't an update file. Use the file Claude sent you.")}}
async function applyGo(){const pl=S.applyPlan;if(!pl)return;
  const ticked=[...document.querySelectorAll("[data-apck]:checked")].map(x=>pl.items[Number(x.dataset.apck)]);
  if(!ticked.length)return toast("Tick at least one project.");
  const btn=document.querySelector('[data-act="applyGo"]');btn.disabled=true;let n=0;
  for(const it of ticked){const p=S.projects.find(x=>x.id===it.pid);if(!p)continue;
    const u={source:"meeting notes"};
    for(const k of ["status","phase","percent","nextMilestone","milestoneDate"])if(it.set[k]!=null)u[k]=it.set[k];
    Object.assign(u,it.note);if(u.percent==null)u.percent=p.percent||0;if(u.percent===100&&!u.status&&p.status!=="Complete")u.status="Complete";
    if(!await postUpdate(it.pid,u))continue;
    const patch={};for(const k of ["priority","startDate","dueDate"])if(it.set[k]!=null)patch[k]=it.set[k];
    if(it.set.budget!=null)patch.details={...(p.details||{}),[budgetKey(p)]:String(it.set.budget)};
    if(Object.keys(patch).length){patch.updatedAt=now();try{await S.db.doc("projects/"+it.pid).update(patch)}catch(e){toast(friendly(e));continue}}
    n++}
  S.applyPlan=null;closeSheet();render();toast(n?`Saved updates on ${n} project${n>1?"s":""}`:"Nothing was saved")}

function knockBarHTML(){const n=S.knocks;if(!n.length)return"";
  return `<button type="button" class="reqbar" data-act="knocks"><span class="ti">${IC.people}</span><span class="tt"><b>${n.length===1?esc(n[0].name||n[0].email)+" is":n.length+" people are"} waiting to sign in</b><span>They made an account but aren't on your list yet. ${n.length>1?"Newest: "+esc(n[0].name||n[0].email)+" · ":""}${ago(n[0].at)}</span></span><span class="go">Review</span></button>`}
function renderKnocks(){
  openSheet("knocks",`<div class="sheet-head"><h2>Waiting to sign in</h2><button class="btn small" data-act="close">Close</button></div>
  <div class="stack" style="margin-top:14px"><p class="meta" style="margin:0">These people made an account and tried to sign in, but their email isn't on any of your contacts. Let them in and they'll be able to sign in. They only see the projects and groups you give them.</p>
  <div class="pglist">${S.knocks.map(k=>`<div class="pg" style="padding:12px 14px;display:grid;gap:10px"><div><b>${esc(k.name||"No name given")}</b><div class="meta">${esc(k.email)} · tried ${ago(k.at)}</div></div>
    <div class="row"><button class="btn small primary" data-knockin="${esc(k.id)}">Let them in</button><button class="btn small ghost" data-knockno="${esc(k.id)}">Ignore</button></div></div>`).join("")||`<div class="empty">No one is waiting.</div>`}</div></div>`)}
async function letIn(id){const k=S.knocks.find(x=>x.id===id);if(!k)return;const email=low(k.email);
  try{let cid=Object.keys(S.contacts).find(c=>low(S.contacts[c].email)===email);
    if(!cid){const full={name:k.name||email,role:"",company:"",department:"",phone:"",email,notes:"",updatedAt:now()};const ref=await S.db.collection("contacts").add(full);cid=ref.id;S.contacts[cid]=full}
    await S.db.doc("access/"+email).set({contact:cid,name:k.name||"",at:now()});
    await S.db.doc("knock/"+id).delete();
    toast((k.name||email)+" can sign in now. Pick what they can see.");openContact("c:"+cid)}catch(e){toast(friendly(e))}}

/* ---------- project requests ---------- */

const REQ_URG={Low:"Whenever there's time",Normal:"Normal",High:"Soon",Urgent:"Urgent"};
const reqType=t=>(REQ_TYPES.find(x=>x[0]===t)||[0,"Not sure"])[1];
const newReqs=()=>S.requests.filter(r=>!r.status||r.status==="new");
const dayOf=v=>{const d=new Date(/^\d{4}-\d\d-\d\d$/.test(v)?v+"T00:00":v);return isNaN(d)?String(v):d.toLocaleDateString()};
function reqBarHTML(){const n=newReqs();if(!n.length)return"";const r=n[0];
  return `<button type="button" class="reqbar" data-act="requests"><span class="ti">${IC.inbox}</span><span class="tt"><b>${n.length} project request${n.length>1?"s":""} waiting for your approval</b><span>Newest: ${esc(r.title)} from ${esc(r.name)} · ${ago(r.at)}</span></span><span class="go">Review</span></button>`}

  const tab=S.reqTab||"new",by={new:[],accepted:[],declined:[]};S.requests.forEach(r=>(by[r.status]||by.new).push(r));
  const keep=layer.dataset.view==="requests"?layer.querySelector(".sheet")?.scrollTop||0:0;
  const kv=(l,v)=>v?`<dt>${l}</dt><dd>${v}</dd>`:"";

      ${r.description?`<div class="desc">${esc(r.description)}</div>`:""}
      <dl class="kv">${kv("From",esc(r.name)+(r.department?` <span class="meta">· ${esc(r.department)}</span>`:""))}${kv("Email",r.email?`<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>`:"")}${kv("Phone",r.phone?`<a href="tel:${esc(r.phone)}">${esc(r.phone)}</a>`:"")}${kv("Building / area",esc(r.location))}${kv("Needed by",r.neededBy?esc(dayOf(r.neededBy)):"")}${kv("Budget",esc(r.budget))}${kv("Sent",r.at?esc(new Date(r.at).toLocaleString()):"")}${r.status==="declined"?kv("Declined",esc(r.declineNote||"No reason given")):""}</dl>
      ${r.status==="accepted"?`<div class="row">${p?`<button class="btn small primary" data-open="${esc(p.id)}">Open project</button>`:`<span class="meta">The project made from this request was deleted.</span>`}</div>`:
       r.status==="declined"?`<div class="row"><button class="btn small" data-rqreopen="${id}">Move back to New</button><button class="btn small ghost" data-rqdel="${id}">Delete</button></div>`:
       `<div class="row"><button class="btn small primary" data-rqok="${id}">Approve</button><button class="btn small" data-rqno="${id}">Decline</button><button class="btn small ghost" data-rqdel="${id}">Delete</button></div><div id="rqno_${id}"></div>`}
    </div></details>`};
  openSheet("requests",`<div class="sheet-head"><h2>Project requests</h2><button class="btn small" data-act="close">Close</button></div>
  <div class="reqlink"><button class="btn small primary" data-act="reqForm">${IC.plus}Add a request</button><span class="meta">Share the request page: <a href="${esc(REQ_URL)}" target="_blank" rel="noopener">${esc(REQ_URL.replace(/^https?:\/\//,""))}</a></span><button class="btn small" data-copy="${esc(REQ_URL)}">Copy link</button></div>
  <div class="tabs" role="tablist">${[["new","Waiting for approval"],["accepted","Approved"],["declined","Declined"]].map(([k,l])=>`<button class="tab" role="tab" data-rqtab="${k}" aria-selected="${tab===k}">${l} (${by[k].length})</button>`).join("")}</div>
  <div class="stack" style="margin-top:14px"><div class="pglist">${by[tab].map(row).join("")||`<div class="empty">${tab==="new"?"Nothing waiting for approval. Share the request page and new requests will show up here.":"Nothing here yet."}</div>`}</div>
  <div class="field autoapp"><label for="autoAdd">Skip approval for</label><span class="hint">Requests from these people go straight onto your project list. Matched by the name or email on the request.</span>

  openSheet("reqform",`<div class="sheet-head"><h2>${own?"Add a request":"Request a project"}</h2><button class="btn small" data-act="${own?"requests":"close"}">${own?"Back":"Close"}</button></div>

  </div>
  <div class="actions"><button class="btn primary" data-act="reqSend">${own?"Add request":"Send request"}</button></div>`)}
async function sendReq(){const g=id=>document.getElementById(id).value.trim();
  const d={name:g("qName"),email:low(g("qEmail")),phone:g("qPhone"),department:g("qDept"),title:g("qTitle"),type:g("qType"),location:g("qLoc"),description:g("qDesc"),
    priority:segVal(document.getElementById("qUrg"))||"Normal",neededBy:g("qNeed"),budget:g("qBudget"),status:"new",at:now(),via:"app",by:S.me};
  if(!d.name)return toast(S.isOwner?"Add who it's from.":"Add your name.");
  if(!d.title)return toast("Say what's needed.");
  if(!d.description)return toast("Add a few details.");
  for(const k of Object.keys(d))if(d[k]==="")delete d[k];
  try{await S.db.collection("requests").add(d);if(!S.isOwner)window.pingOwner?.("New project request","Open your tracker to approve or decline it.");toast(S.isOwner?"Request added":"Request sent");if(S.isOwner){S.reqTab="new";return renderRequests()}closeSheet()}catch(e){toast(friendly(e))}}
async function decideReq(id,patch,msg){try{await S.db.doc("requests/"+id).update(patch);toast(msg)}catch(e){toast(friendly(e))}}
const AUTO_DEFAULT=["Adam Aasen"]; // Clint, 2026-10-04: Adam's requests skip approval
const autoList=()=>S.reqSettings?.autoApprove??AUTO_DEFAULT;
const isAuto=r=>autoList().some(x=>{const v=low(x);return v&&(v===low(r.name)||v===low(r.email))});
async function saveAutoList(list){try{await S.db.doc("settings/requests").set({autoApprove:list})}catch(e){toast(friendly(e))}}
function requesterKey(r){const em=low(r.email);if(!em)return""; // the person who asked can follow the project if Clint already has them
  const pid=Object.keys(S.people).find(id=>id!==S.me&&low(S.people[id].email)===em);if(pid)return pid;
  const cid=Object.keys(S.contacts).find(id=>low(S.contacts[id].email)===em);return cid?"c:"+cid:""}
function runAutoApprove(){if(!S.isOwner||!S.reqSettingsLoaded)return;
  newReqs().filter(r=>isAuto(r)&&!S.autoDone.has(r.id)).forEach(r=>{S.autoDone.add(r.id);approveRequest(r.id,"",true).then(ok=>{if(ok)toast("Added "+(r.title||"a request")+" from "+String(r.name||"").trim()+" to your projects")})})}
async function approveRequest(id,cat,auto){const r=S.requests.find(x=>x.id===id);if(!r||(r.status&&r.status!=="new"))return false;
  cat=cat||(CATS[r.type]?r.type:auto?"maintenance":"");
  if(!cat){const box=document.getElementById("rqno_"+id);if(box)box.innerHTML=`<div class="stack" style="gap:8px"><span class="meta">What kind of project is it?</span><div class="row">${Object.entries(CATS).map(([k,c])=>`<button class="btn small" data-rqcat="${k}" data-rqid="${esc(id)}">${esc(c.label)}</button>`).join("")}</div></div>`;return false}
  const num=Number(String(r.budget||"").replace(/[$,\s]/g,"")),bf=CATS[cat].fields.find(f=>f.k==="budget"||f.k==="cost"),useNum=bf&&isFinite(num)&&num>0;
  const who=[r.name,r.department].map(x=>String(x||"").trim()).filter(Boolean).join(", "),reach=[r.email,r.phone].filter(Boolean).join(", "),mem=requesterKey(r),t=now(),pid="req_"+id;
  const [rl0,...rl1]=String(r.location||"").split(" · "),rb=bldgOf(rl0);const body={name:r.title||"Untitled request",category:cat,location:rb?rb.name:r.location||"",area:rb?rl1.join(" · "):"",address:rb?rb.address:"",taxRate:rb?rb.tax:null,priority:PRIORITIES.includes(r.priority)?r.priority:"Normal",startDate:"",dueDate:r.neededBy||"",
    description:r.description||"",members:mem?[mem]:[],groups:[],jobNumber:"",department:r.department||"",lead:S.people[S.me]?.name||"",phase:"",nextMilestone:"",milestoneDate:"",
    notes:["Requested by "+who+(reach?" ("+reach+")":"")+(r.at?" on "+dayOf(r.at):"")+".",r.budget&&!useNum?"Budget given: "+r.budget+".":"",auto&&!CATS[r.type]?"Kind of work wasn't given, so this was filed under Maintenance.":""].filter(Boolean).join(" "),
    details:useNum?{[bf.k]:String(num)}:{},schedule:{freq:"weekly",day:1},status:"Not started",updatedAt:t,percent:0,owner:S.me,memberInfo:{[S.me]:{addedAt:t}},createdAt:t,lastUpdateAt:t,lastCheckin:{[S.me]:t},requestId:id};
  try{const ex=await S.db.doc("projects/"+pid).get();if(!ex.exists)await S.db.doc("projects/"+pid).set(body); // fixed id: two open tabs can't make it twice
    await S.db.doc("requests/"+id).update({status:"accepted",projectId:pid,decidedAt:t,...(auto?{auto:true}:{})});
    if(!auto)toast("Approved. It's on your project list.");return true}catch(e){if(!auto)toast(friendly(e));else S.autoDone.delete(id);return false}}

/* ---------- new / edit project ---------- */
let W=null;
function startWizard(edit){
  W=edit?{step:1,edit:edit.id,d:JSON.parse(JSON.stringify(edit))}:{step:0,d:{category:"",priority:"Normal",status:"Not started",details:{},schedule:{freq:"daily",day:1},members:[],groups:[]}};
  renderWizard()}
function wizardCollect(){
  const g=id=>document.getElementById(id);const d=W.d;
  if(W.step===1){d.name=g("fName").value.trim();Object.assign(d,bldgVal());d.area=g("fArea").value.trim();d.priority=segVal(g("fPri"))||"Normal";d.startDate=g("fStart").value;d.dueDate=g("fDue").value;d.description=g("fDesc").value.trim();d.jobNumber=g("fJob").value.trim();d.department=deptVal();d.lead=g("fLead").value.trim();d.phase=segVal(g("fPhase"));d.nextMilestone=g("fMs").value.trim();d.milestoneDate=g("fMsDate").value;d.notes=g("fNotes").value.trim();if(W.edit)d.percent=Number(g("fPct").value)||0;if(W.edit)d.status=g("fStatus").value}
  if(W.step===2){CATS[d.category].fields.forEach(f=>{const el=g("c_"+f.k);d.details[f.k]=f.type==="seg"?segVal(el):el.value.trim()})}
  if(W.step===4){d.groups=[...document.querySelectorAll('input[name="vg"]:checked')].map(x=>x.value);}
}
function pickable(){ // app users plus contacts, minus contacts who already use the app
  const ids=[...Object.keys(S.people).filter(id=>id!==S.me),...Object.keys(S.contacts).filter(c=>!contactUser(c)).map(c=>"c:"+c)];
  return ids.sort((a,b)=>nameOf(a).localeCompare(nameOf(b)))}

    ${avail.length?`<select id="vpAdd"><option value="">+ Add a person…</option>${avail.map(id=>`<option value="${esc(id)}">${esc(nameOf(id))}${subOf(id)?" · "+esc(subOf(id)):""}${isContactKey(id)?" (not signed in yet)":""}</option>`).join("")}</select>`:people.length?"":`<span class="hint">No people yet. Add contacts on the People &amp; groups page.</span>`}
    ${sel.some(isContactKey)?`<span class="hint">People who haven't signed in yet need an email on their contact. They'll see the project once they create an account with that email.</span>`:""}`}

    <div class="row" style="align-items:start"><div class="field" style="flex:2;min-width:180px"><label for="fMs">Next milestone</label><input type="text" id="fMs" value="${esc(d.nextMilestone)}" placeholder="e.g. Insulation"></div>

  if(W.step===2)body=c.fields.map(f=>{const v=d.details[f.k]??"";const id="c_"+f.k;
    const input=f.type==="seg"?segHTML(id,f.options,v):f.type==="textarea"?`<textarea id="${id}">${esc(v)}</textarea>`:`<input type="${f.type==="number"?"number":"text"}" inputmode="${f.type==="number"?"decimal":"text"}" id="${id}" value="${esc(v)}">`;

// phone photos are 3-5 MB; shrink them to 2000px on the long side so the free storage lasts (Clint, 2026-10-07)
async function shrinkPhoto(file){
  const t=file.type,big=file.size>600*1024;
  if(!big||!(/^image\/(jpeg|webp|heic|heif)$/.test(t)||t==="image/png"&&file.size>1.5*1024*1024))return file;
  try{const bm=await createImageBitmap(file,{imageOrientation:"from-image"}),k=Math.min(1,2000/Math.max(bm.width,bm.height));
    const c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(bm,0,0,c.width,c.height);bm.close?.();
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));if(!blob||blob.size>=file.size)return file;
    return new File([blob],file.name.replace(/\.[^.]+$/,"")+".jpg",{type:"image/jpeg"})}catch(e){return file}}
async function uploadFiles(pid,list,updateId){

    if(prog)prog.textContent=`Uploading ${i+1} of ${list.length}: ${file.name}`;
    file=await shrinkPhoto(file);
    const ext=file.name.split(".").pop().toLowerCase();const clean=/^(image|video)\/|^application\/pdf$/.test(file.type);const type=clean?file.type:(EXT_TYPES[ext]||file.type);
    try{const a=await S.assets.upload(file,type?{type}:undefined);
      await S.db.collection("files").add({projectId:pid,updateId:updateId||"",assetId:a.id,url:a.url,name:file.name,contentType:a.contentType,size:a.sizeBytes,author:S.me,at:now()});out.push(file.name)}

  }
  if(prog)prog.textContent="";return out}

async function syncAccess(cid,oldEmail,email,name){ // the sign-in allow list follows the contact's email

async function importOld(file){
  const prog=document.getElementById("importProg"),say=t=>{if(prog)prog.textContent=t};
  let data;try{data=JSON.parse(await file.text())}catch(e){return toast("That file isn't an export file.")}
  if(!data.projects)return toast("That file isn't an export file.");
  const old=data.oldOwnerId||"u_k0UxCXmdoxJQCo30c3Hgqg",swap=v=>JSON.parse(JSON.stringify(v).split(old).join(S.me));
  const w=[];for(const [id,p] of Object.entries(data.projects)){const {_updates,...d}=p;w.push(["projects/"+id,{...d,owner:S.me}]);for(const [u,x] of Object.entries(_updates||{}))w.push(["projects/"+id+"/updates/"+u,x])}
  for(const c of ["contacts","groups","questions","files"])for(const [id,d] of Object.entries(data[c]||{}))w.push([c+"/"+id,d]);
  for(const [id,d] of Object.entries(data.people||{}))if(id!==old)w.push(["people/"+id,d]);else if(!S.meDoc)w.push(["people/"+S.me,{...d,email:S.profiles[S.me]?.email||""}]);
  for(const [id,c] of Object.entries(data.contacts||{})){const em=low(c.email);if(em)w.push(["access/"+em,{contact:id,name:c.name||"",at:now()}])}
  try{for(const [i,[path,d]] of w.entries()){say("Copying "+(i+1)+" of "+w.length+"…");await S.db.doc(path).set(swap(d))}say("");toast("Imported "+Object.keys(data.projects).length+" projects")}catch(e){say("");toast(friendly(e))}}

    if(d.rqreopen)return decideReq(d.rqreopen,{status:"new",declineNote:"",decidedAt:""},"Moved back to New");

  const b=t.closest("[data-vis],[data-copy],[data-cedit],[data-csave],[data-cdel],[data-fdel],[data-gsave],[data-gdel],[data-layout],[data-act],[data-open],[data-update],[data-filter],[data-tab],[data-cat],[data-answer],[data-remove],[data-chk]");if(!b)return;

  if(e.target.id==="rDays")return openReport(Number(e.target.value));
  if(e.target.id==="applyFile"&&e.target.files[0])return loadApplyFile(e.target.files[0]);
  if(e.target.id==="pFilter"){S.filter=e.target.value;return render()}
  if(e.target.id==="fLoc"){const o=document.getElementById("fLocOther"),sh=document.getElementById("fLocShow"),b=bldgOf(e.target.value);o.hidden=e.target.value!=="__other";sh.hidden=!b;sh.innerHTML=bldgAddrLine(b);if(!o.hidden)document.getElementById("fLocName").focus();return}
  if(e.target.id==="fDept"){const o=document.getElementById("fDeptOther");o.hidden=e.target.value!=="__other";if(!o.hidden)o.focus();return}
  if(e.target.dataset?.col){const on=colsOn();e.target.checked?on.add(e.target.dataset.col):on.delete(e.target.dataset.col);try{localStorage.setItem("cols",JSON.stringify([...on]))}catch(err){}S.colsOpen=true;render();S.colsOpen=false;return}
  if(e.target.id==="vpAdd"&&e.target.value&&W){W.d.members=[...(W.d.members||[]),e.target.value];wizardCollect();renderWizard();setTimeout(()=>document.getElementById("vpAdd")?.focus(),0);return}if(e.target.dataset?.prio){const id=e.target.dataset.prio,v=e.target.value;try{await S.db.doc("projects/"+id).update({priority:v,updatedAt:now()});toast("Urgency set to "+v)}catch(err){toast(friendly(err))}return}if(e.target.id==="importFile"&&e.target.files.length)return importOld(e.target.files[0]);if(e.target.id==="fileIn"&&e.target.files.length){const n=await uploadFiles(S.open,e.target.files,"");if(n.length)toast(n.length+" file"+(n.length>1?"s":"")+" added")}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&layer.dataset.view){W=null;closeSheet()}
  if(e.key==="Enter"&&e.target.classList?.contains("card"))e.target.click();
  if(e.key==="Enter"&&e.target.id?.startsWith("ans_"))answerQ(e.target.id.slice(4));
  if(e.key==="Enter"&&e.target.id==="jCode")joinGo();
  if(e.key==="Enter"&&e.target.id==="autoAdd")document.querySelector('[data-act="autoAdd"]')?.click();
  if(e.key==="Enter"&&e.target.id?.startsWith("ckin_")){const p=curProject(),ph=p&&phaseOfSlug(p,e.target.id.slice(5));if(ph)addItem(ph)}
});
boot();
</script>
